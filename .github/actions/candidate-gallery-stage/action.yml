name: Fresh exact-SHA candidate staging
description: Build and stage all six packages in disposable checkouts without changing source metadata or registry locks.
inputs:
  gallery-ref:
    description: Exact gallery selection already resolved from reviewed source and live PR authorization.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: opf
        fetch-depth: 0
        persist-credentials: false
    - id: refs
      uses: ./opf/.github/actions/ecosystem-refs
      with:
        consumer: opf
        export-golden: 'true'
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: OpenPresentation/opf-render
        ref: ${{ steps.refs.outputs.opf_render }}
        path: opf-render
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: OpenPresentation/opf-pptx
        ref: ${{ steps.refs.outputs.opf_pptx }}
        path: opf-pptx
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: OpenPresentation/opf-editor
        ref: ${{ steps.refs.outputs.opf_editor }}
        path: opf-editor
        fetch-depth: 0
        persist-credentials: false
    - shell: bash
      run: |
        npm install --global npm@11.16.0
        pnpm --dir opf install --frozen-lockfile
        for repo in opf-render opf-pptx opf-editor; do npm ci --prefix "$repo"; done
    - uses: ./opf/.github/actions/candidate-gallery
      with:
        candidate-gallery-ref: ${{ inputs.gallery-ref }}
    - shell: bash
      working-directory: opf
      run: |
        test -n "$CANDIDATE_GALLERY_REF"
        node scripts/candidate-gallery-build.mjs
