name: Explicit candidate gallery source setup
description: Resolve reviewed gallery data after the core checkout exists; default dependency behavior is unchanged.
inputs:
  token:
    description: Read-only token for live PR authorization.
    default: ${{ github.token }}
  candidate-gallery-ref:
    description: Exact SHA for manual qualification; PR and queue authorization comes from the live PR trailer.
    default: ''
outputs:
  sha:
    value: ${{ steps.resolve.outputs.candidate_gallery }}
runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      working-directory: opf
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        CANDIDATE_GALLERY_REF: ${{ inputs.candidate-gallery-ref }}
      run: node scripts/candidate-gallery.mjs resolve
    - if: steps.resolve.outputs.candidate_gallery != ''
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: OpenPresentation/gallery
        ref: ${{ steps.resolve.outputs.candidate_gallery }}
        path: gallery-candidate
        persist-credentials: false
        fetch-depth: 1
    - if: steps.resolve.outputs.candidate_gallery != ''
      shell: bash
      run: |
        npm ci --prefix gallery-candidate
        npm run build --prefix gallery-candidate
        cd opf
        node scripts/candidate-gallery.mjs link
        node scripts/materialize-gallery-catalog.mjs
