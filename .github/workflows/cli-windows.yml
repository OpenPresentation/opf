name: CLI portability
on:
  pull_request:
    paths:
      - 'packages/cli/**'
      - 'packages/javascript/**'
      - 'skills/**'
      - 'scripts/run-node-tests.mjs'
      - 'pnpm-lock.yaml'
      - '.github/workflows/cli-windows.yml'
  push:
    branches: [main]
    paths:
      - 'packages/cli/**'
      - 'packages/javascript/**'
      - 'skills/**'
      - 'scripts/run-node-tests.mjs'
      - 'pnpm-lock.yaml'
      - '.github/workflows/cli-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cli-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cli:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        node: [20, 24]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openpresentation/cli typecheck
      - run: pnpm test:cli
      - run: pnpm test:cli:packed
