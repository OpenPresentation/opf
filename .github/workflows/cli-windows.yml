name: CLI portability
on:
  pull_request:
    paths:
      - 'packages/cli/**'
      - 'packages/javascript/**'
      - 'skills/**'
      - 'scripts/run-node-tests.mjs'
      - 'scripts/package-manager.mjs'
      - 'scripts/typecheck.mjs'
      - 'scripts/check-packed-types.mjs'
      - 'package.json'
      - 'scripts/link-ecosystem.mjs'
      - 'scripts/test-ecosystem-links.mjs'
      - 'scripts/test-package-ecosystem.mjs'
      - 'pnpm-lock.yaml'
      - '.gitattributes'
      - '.github/workflows/cli-windows.yml'
  push:
    branches: [main]
    paths:
      - 'packages/cli/**'
      - 'packages/javascript/**'
      - 'skills/**'
      - 'scripts/run-node-tests.mjs'
      - 'scripts/package-manager.mjs'
      - 'scripts/typecheck.mjs'
      - 'scripts/check-packed-types.mjs'
      - 'package.json'
      - 'scripts/link-ecosystem.mjs'
      - 'scripts/test-ecosystem-links.mjs'
      - 'scripts/test-package-ecosystem.mjs'
      - 'pnpm-lock.yaml'
      - '.gitattributes'
      - '.github/workflows/cli-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cli-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cli:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @openpresentation/opf test
      - run: node packages/javascript/test/packed-install-smoke.mjs
      - run: node scripts/test-ecosystem-links.mjs
      - run: pnpm test:cli
      - run: pnpm test:cli:packed
