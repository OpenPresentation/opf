name: CLI portability
# RR-57: Windows and macOS legs of the CLI (about 22 runner minutes per run). A pull request no longer runs them unless it
# carries the label `full-ci` and changes one of the paths below: add the label when a change touches OS-specific code (paths, spawn, line endings, the Windows
# package-manager helpers). The `labeled` event starts the run without a new push; any other label starts nothing. The merge
# queue (merge_group) runs them when the entry changes one of the paths below (the `paths:` filter does not apply to
# merge_group, so the first job applies it), which replaces the push-to-main run: the queue tested that exact commit.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'packages/cli/**'
      - 'packages/javascript/**'
      - 'skills/**'
      - 'scripts/run-tests.mjs'
      - 'scripts/package-manager.mjs'
      - 'scripts/global-prefix.mjs'
      - 'scripts/typecheck.mjs'
      - 'scripts/check-packed-types.mjs'
      - 'package.json'
      - 'scripts/link-ecosystem.mjs'
      - 'scripts/test-ecosystem-links.mjs'
      - 'scripts/test-package-ecosystem.mjs'
      - 'pnpm-lock.yaml'
      - '.gitattributes'
      - '.github/workflows/cli-windows.yml'
  merge_group:
  workflow_dispatch:
    inputs:
      candidate-gallery-ref:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: cli-windows-${{ github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' && 'ignored' || 'run' }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}
jobs:
  # Merge queue only: does this entry change a path above? Any other event answers true and the next job decides.
  scope:
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: paths
        uses: ./.github/actions/paths-changed
        with:
          paths: |
            packages/cli/**
            packages/javascript/**
            skills/**
            scripts/run-tests.mjs
            scripts/package-manager.mjs
            scripts/global-prefix.mjs
            scripts/typecheck.mjs
            scripts/check-packed-types.mjs
            package.json
            scripts/link-ecosystem.mjs
            scripts/test-ecosystem-links.mjs
            scripts/test-package-ecosystem.mjs
            pnpm-lock.yaml
            .gitattributes
            .github/workflows/cli-windows.yml
  cli:
    needs: scope
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'merge_group' && needs.scope.outputs.run == 'true') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci') && (github.event.action != 'labeled' || github.event.label.name == 'full-ci'))) }}
    runs-on: ${{ matrix.os }}
    # RR-57: about 2x the p90 (13.4 min on Windows, 9.0 on macOS over the last 10 runs); the old limit of 15 was 1.1x.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - id: gallery
        name: Resolve the explicit reviewed candidate boundary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_GALLERY_REF: ${{ inputs.candidate-gallery-ref || '' }}
        run: node scripts/candidate-gallery.mjs resolve
      - uses: ./.github/actions/candidate-gallery-stage
        if: steps.gallery.outputs.candidate_gallery != ''
        with:
          gallery-ref: ${{ steps.gallery.outputs.candidate_gallery }}
      - run: pnpm install --frozen-lockfile
        if: steps.gallery.outputs.candidate_gallery == ''
      - run: pnpm typecheck
        working-directory: ${{ steps.gallery.outputs.candidate_gallery != '' && 'opf' || '.' }}
      - run: pnpm --filter @openpresentation/opf test
        working-directory: ${{ steps.gallery.outputs.candidate_gallery != '' && 'opf' || '.' }}
      - run: node packages/javascript/test/packed-install-smoke.mjs
        working-directory: ${{ steps.gallery.outputs.candidate_gallery != '' && 'opf' || '.' }}
      - run: node scripts/test-ecosystem-links.mjs
        working-directory: ${{ steps.gallery.outputs.candidate_gallery != '' && 'opf' || '.' }}
      - run: pnpm test:cli
        working-directory: ${{ steps.gallery.outputs.candidate_gallery != '' && 'opf' || '.' }}
      - run: pnpm test:cli:packed
        working-directory: ${{ steps.gallery.outputs.candidate_gallery != '' && 'opf' || '.' }}
      - run: pnpm test:cli:packed:peers
        working-directory: ${{ steps.gallery.outputs.candidate_gallery != '' && 'opf' || '.' }}
      # RR-66 (opf#466): the published CLI from the npm registry, installed globally and run through npm exec, as the
      # ecosystem registry shard checks it on Linux. Its command tests come from the CLI's release commit, which the shallow
      # checkout does not have: fetch that one commit.
      - name: Verify the published CLI from the npm registry
        working-directory: ${{ steps.gallery.outputs.candidate_gallery != '' && 'opf' || '.' }}
        shell: bash
        env:
          CANDIDATE_GALLERY_REF: ''
        run: |
          git fetch --no-tags --depth=1 origin "$(node -p "require('./release-plan.json').verificationRefs.cli")"
          node packages/cli/test/packed.mjs --registry
