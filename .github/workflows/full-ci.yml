name: NEVERMERGE Windows worker-flight witness
# Evidence branch only. This replaces Full CI ONLY on this branch; never merge or treat it as release verification.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  witness:
    name: One normal Windows witness and Office-free Name controls
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: '24.22.2'
      - name: Maintained own package and playground builds
        shell: bash
        run: |
          pnpm run build:packages
          node packages/editor/scripts/build-playground.mjs
      - name: Install the lock-pinned Chromium
        working-directory: packages/editor
        run: pnpm exec playwright install chromium
      - name: One bound witness; preserve each original child outcome
        run: node docs/evidence/worker-flight-witness/run.mjs
      - name: Preserve owned diagnostic evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-flight-windows-once
          path: artifacts/worker-flight-witness/**
          retention-days: 7
          if-no-files-found: warn
