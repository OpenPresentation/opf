name: NEVERMERGE Windows Name snapshot temp validation
# Branch-only replacement: no browser, no Office, not Full CI or release qualification. Never merge this branch.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    name: One maintained Node9 and actual Office-free PS32
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: '24.22.2'
      - name: Maintained own package build
        shell: bash
        run: pnpm run build:packages
      - name: One bound validation-only file
        run: node docs/evidence/name-snapshot-temp-validation/run.mjs
      - name: Preserve the exact outcome and owned fixtures
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: name-snapshot-temp-validation-once
          path: artifacts/name-snapshot-temp-validation/**
          retention-days: 7
          if-no-files-found: warn
