name: Publish OPF CLI
on:
  push:
    tags: [cli-v*]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-cli
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.16.0
      - run: pnpm install --frozen-lockfile
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(node -p "require('./packages/cli/package.json').version")"
          test "${GITHUB_REF_NAME}" = "cli-v${VERSION}"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:breaking
      - name: Verify standalone executable installation
        run: pnpm test:cli:packed
      # RR-59 (opf#476): the release gate of the installed contract: the candidate CLI and core beside the published opf-render and opf-pptx
      # and the Noto JP/SC packages, offline after install (portable script-font SVG, the unresolved-image gate, zero fetches). On a cli-v* tag
      # the peers must satisfy the CLI's ranges; there is no skip (scripts/unreleased-gate.mjs).
      - name: Verify the installed CLI with its peers (script-font SVG, unresolved-image gate)
        run: pnpm test:cli:packed:peers
      # Configure this workflow as the CLI's npm trusted publisher after the
      # authenticated first publication. No long-lived npm token is required here.
      - name: Publish bundled CLI
        working-directory: packages/cli
        run: npm publish --access public --provenance

  # RR-20: every npm publish creates its GitHub Release (from 0.18 on), notes taken from the version's packages/cli/CHANGELOG.md section.
  # Separate job: only it holds contents: write; the publish job keeps id-token: write for provenance and contents: read.
  # --latest=false: the core release (opf-v*) owns "Latest" in this repository.
  release:
    name: Create GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Extract release notes from packages/cli/CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#cli-v}"
          NOTES_FILE="$(mktemp)"

          # The section under "## VERSION" or "## VERSION (date)", without its blank edges (scripts/release-notes.mjs, shared with core).
          node scripts/release-notes.mjs --version "${VERSION}" --changelog packages/cli/CHANGELOG.md --out "${NOTES_FILE}"

          if [ ! -s "${NOTES_FILE}" ]; then
            echo "packages/cli/CHANGELOG.md has no '## ${VERSION}' section (or it is empty); add it before publishing." >&2
            exit 1
          fi

          echo "NOTES_FILE=${NOTES_FILE}" >> "${GITHUB_ENV}"
          echo "RELEASE_VERSION=${VERSION}" >> "${GITHUB_ENV}"
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --json tagName >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; preserving its notes."
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "@openpresentation/cli ${RELEASE_VERSION}" \
              --notes-file "${NOTES_FILE}" \
              --verify-tag \
              --latest=false
          fi
