name: Coordinated public packages
on:
  pull_request:
  push:
    branches: [main, codex/opf-ecosystem-20260907]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ecosystem-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: opf
          fetch-depth: 0
          persist-credentials: false
      # These commits are the coordinated checkpoint, not mutable default branches.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: OpenPresentation/opf-render
          ref: 628d65ee32d04d08b4a1023c4b3bb7826a9114ae
          path: opf-render
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: OpenPresentation/opf-editor
          ref: 927a31ba52e27a6e965f941f5897a74171e1fdb9
          path: opf-editor
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: OpenPresentation/opf-pptx
          ref: ca23bbd93a3b4501bfcef83e0804a8c510bcac5d
          path: opf-pptx
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: opf/pnpm-lock.yaml
      - name: Install locked dependencies
        run: |
          pnpm --dir opf install --frozen-lockfile
          for repo in opf-render opf-editor opf-pptx; do
            npm ci --prefix "$repo"
          done
      - name: Build and link coordinated sources
        working-directory: opf
        run: |
          pnpm build
          node scripts/link-ecosystem.mjs --packages-only
      - name: Model, geometry, fonts, CLI, TypeScript and packed browser bundle checks
        working-directory: opf
        env:
          OPF_GOLDEN_BASELINE: ${{ github.workspace }}/opf/scripts/fixtures/opf-examples-png.sha256.json
        run: pnpm test:packages
      - name: Verify exact published registry packages and fidelity fixtures
        working-directory: opf
        run: |
          pnpm test:registry-ecosystem
          pnpm test:registry-fidelity
      - name: Report the verification boundary
        if: always()
        run: |
          echo 'This job tests coordinated source and local tarball installs. It includes the reviewed renderer raster regression baseline, but does not establish complete visual correctness, npm publication, native PowerPoint fidelity, or browser interaction coverage. Private sites run separately.' >> "$GITHUB_STEP_SUMMARY"
