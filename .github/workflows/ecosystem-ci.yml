name: Coordinated public packages
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ecosystem-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: opf
          fetch-depth: 0
          persist-credentials: false
      # These commits are the coordinated checkpoint, not mutable default branches.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf-render
          ref: 9f34d70002307fcb3795de638e7e4bf0605a33f8
          path: opf-render
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf-editor
          ref: e8bdedf7f80e2eab0ff7d869b9436cd2050e426d
          path: opf-editor
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf-pptx
          ref: f7f30082da3568a4f911d42493ffc75c77dd4e14
          path: opf-pptx
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: opf/pnpm-lock.yaml
      - name: Install locked dependencies
        run: |
          pnpm --dir opf install --frozen-lockfile
          for repo in opf-render opf-editor opf-pptx; do
            npm ci --prefix "$repo"
          done
      - name: Build and link coordinated sources
        working-directory: opf
        run: |
          pnpm build
          node scripts/link-ecosystem.mjs --packages-only
      - name: Model, geometry, fonts, CLI, TypeScript and packed browser bundle checks
        working-directory: opf
        env:
          OPF_GOLDEN_BASELINE: ${{ github.workspace }}/opf/scripts/fixtures/opf-examples-png.sha256.json
        run: pnpm test:packages
      - name: Verify exact published registry packages and fidelity fixtures
        working-directory: opf
        run: |
          pnpm test:registry-ecosystem
          pnpm test:registry-fidelity
          node packages/cli/test/packed.mjs --registry
      - name: Report the verification boundary
        if: always()
        run: |
          echo 'This job tests coordinated source, local tarballs, and exact published registry installs against pinned fixtures. It includes the renderer raster regression baseline and generated browser bundles; native PowerPoint fidelity and executed browser interactions require separate evidence. Private sites run separately.' >> "$GITHUB_STEP_SUMMARY"
