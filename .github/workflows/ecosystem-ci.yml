name: Coordinated public packages
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ecosystem-${{ github.ref }}
  cancel-in-progress: true
env:
  OPF_RENDER_REF: 8e024faff7a617cc6b8265b96e076dd2da6c3aca
  OPF_EDITOR_REF: 313774a0cbf2bab8cced1a7225dfc95588bdc6e1
  OPF_PPTX_REF: 563aef9dc9514ff37aa1994929e34f7f102db9a2
jobs:
  packages:
    runs-on: ubuntu-latest
    # Matches the renderer's locked Playwright 1.63.0, including Chromium and
    # system libraries; avoids mutable apt repositories during browser setup.
    container: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: opf
          fetch-depth: 0
          persist-credentials: false
      # These commits are the coordinated checkpoint, not mutable default branches.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf-render
          ref: ${{ env.OPF_RENDER_REF }}
          path: opf-render
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf-editor
          ref: ${{ env.OPF_EDITOR_REF }}
          path: opf-editor
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf-pptx
          ref: ${{ env.OPF_PPTX_REF }}
          path: opf-pptx
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: opf/pnpm-lock.yaml
      - name: Bind the installed candidate source graph
        working-directory: opf
        run: >-
          node --input-type=module -e "import {execFileSync} from 'node:child_process'; import {mkdirSync,writeFileSync} from 'node:fs';
          const repos=['opf','opf-render','opf-editor','opf-pptx'].map(name=>({name,head:execFileSync('git',['-C','../'+name,'rev-parse','HEAD'],{encoding:'utf8'}).trim(),tree:execFileSync('git',['-C','../'+name,'rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim()}));
          mkdirSync('artifacts/portability',{recursive:true}); writeFileSync('artifacts/portability/source.json',JSON.stringify({node:process.version,platform:process.platform,arch:process.arch,repos},null,2)+'\n');"
      - name: Install locked dependencies
        run: |
          pnpm --dir opf install --frozen-lockfile
          for repo in opf-render opf-editor opf-pptx; do
            npm ci --prefix "$repo"
          done
      - name: Build and link coordinated sources
        working-directory: opf
        run: |
          pnpm build
          node scripts/link-ecosystem.mjs --packages-only
      - name: Model, geometry, fonts, CLI, TypeScript and packed browser bundle checks
        working-directory: opf
        env:
          # The pinned renderer's own baseline (opf-render 0.11.9 `2fbc0ab`, whose source is main `fa1949a` plus the release commit: opf-render#83 and #85, which draw these fields and carry the picture-bullet size and furniture image alignment fixes): core 0.11.4 combines the design fields with the cover
          # alignment change, 181 of 805 slides differ from the renderer 0.11.8 baseline. scripts/fixtures/README.md keeps the review record.
          OPF_GOLDEN_BASELINE: ${{ github.workspace }}/opf-render/test/golden/opf-examples-png.cover-centering.sha256.json
        run: pnpm test:packages
      - name: Verify installed type failure propagation
        working-directory: opf
        run: node scripts/test-packed-types-infrastructure.mjs artifacts/npm/consumer
      - name: Execute installed tarball browser interactions
        working-directory: opf
        run: |
          node -e "if (require('../opf-render/node_modules/playwright/package.json').version !== '1.63.0') throw new Error('Update the pinned Playwright image with the renderer test package.');"
          pnpm test:packed-browser
          node scripts/test-installed-code-guards.mjs
          node ../opf-editor/test/rich-input-browser.mjs artifacts/editor/rich-input-installed.json measured artifacts/npm/consumer
          node scripts/test-plain-whitespace-workflow.mjs artifacts/plain-whitespace-installed installed
          node scripts/test-readability-browser.mjs artifacts/readability-browser installed
          node scripts/test-timeline-workflow.mjs artifacts/timeline-workflow installed
          node scripts/test-furniture-workflow.mjs artifacts/furniture-workflow installed
          node scripts/test-furniture-fields-browser.mjs artifacts/furniture-fields-browser
          node ../opf-editor/test/json-editor-browser.mjs artifacts/editor/json-editor-installed.json artifacts/npm/consumer
          node scripts/test-timeline-acceptance.mjs artifacts/timeline-acceptance.json
      - name: Check scalar source whitespace and accepted browser advances
        working-directory: opf-render
        run: node test/plain-whitespace-browser.mjs artifacts/plain-whitespace-browser
      - name: Check physical font selections in an offline browser
        working-directory: opf-render
        run: npm run test:font-variants-browser
      - name: Check accepted metric outlines and actual offline SVG ink
        working-directory: opf
        run: node scripts/test-metric-outline-browser.mjs artifacts/metric-outline-browser
      - name: Verify exact published registry packages and fidelity fixtures
        working-directory: opf
        run: |
          pnpm test:registry-ecosystem
          pnpm test:layout-contracts:registry
          pnpm test:packed-browser registry
          node ../opf-editor/test/json-editor-browser.mjs artifacts/editor/json-editor-registry.json artifacts/npm/registry-consumer
          node scripts/test-packed-browser-guards.mjs
          node scripts/test-installed-code-guards.mjs --registry
          pnpm test:registry-fidelity
          node scripts/test-quote-layout-geometry.mjs artifacts/npm/registry-consumer artifacts/quote-layout-geometry.json
          node packages/cli/test/packed.mjs --registry
      - name: Measure current checkout code internals with registry fonts
        working-directory: opf
        run: |
          node scripts/test-code-layout-geometry.mjs artifacts/npm/registry-consumer artifacts/code-layout-geometry.json
          node scripts/test-code-layout-browser.mjs artifacts/npm/registry-consumer artifacts/code-layout-geometry.json artifacts/code-layout-browser.json
      - name: Measure current checkout metric internals with registry fonts
        working-directory: opf
        run: |
          node scripts/test-metric-registry-guards.mjs artifacts/npm/registry-consumer
          node scripts/test-metric-layout-geometry.mjs artifacts/npm/registry-consumer artifacts/metric-layout-geometry.json
          node scripts/test-metric-layout-browser.mjs artifacts/npm/registry-consumer artifacts/metric-layout-geometry.json artifacts/metric-layout-browser.json
      - name: Preserve installed-browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-browser-node24
          path: |
            opf/artifacts/portability/**
            opf/artifacts/npm/*.tgz
            opf/artifacts/npm/manifest.json
            opf/artifacts/npm/consumer/package.json
            opf/artifacts/npm/consumer/package-lock.json
            opf/artifacts/npm/consumer/packed-types-*.json
            opf/artifacts/npm/consumer/types-smoke.ts
            opf/artifacts/npm/consumer/artifacts/packed-types/**
            !opf/artifacts/npm/consumer/artifacts/packed-types/**/node_modules/**
            opf/artifacts/npm/consumer/artifacts/font-preparation.json
            opf/artifacts/editor/packed-browser-*-report.json
            opf/artifacts/editor/json-editor-installed.json
            opf/artifacts/editor/packed-browser-*-failure.png
            opf/artifacts/code-layout-geometry.json
            opf/artifacts/code-layout-browser.json
            opf/artifacts/metric-layout-geometry.json
            opf/artifacts/metric-layout-browser.json
            opf/artifacts/metric-layout-browser-*.png
            opf/artifacts/editor/*installed-code*.json
            opf/artifacts/editor/rich-input-installed*.json
            opf/artifacts/editor/rich-input-installed*.png
            opf/artifacts/editor/json-editor-registry.json
            opf/artifacts/npm/registry-consumer/fidelity/report.json
            opf-render/artifacts/golden/**
            opf-render/artifacts/font-variants*.json
            opf/artifacts/npm/consumer/artifacts/*font-variants*.json
            opf/artifacts/metric-outline-browser/**
            opf/artifacts/plain-whitespace-installed/**
            opf/artifacts/readability-browser/**
            opf/artifacts/timeline-workflow/**
            opf/artifacts/furniture-workflow/**
            opf/artifacts/furniture-fields-browser/**
            opf/artifacts/npm/renderer-absent-furniture/**
            opf/artifacts/npm/zip-date-candidate/**
            opf-pptx/artifacts/zip-date/**
            opf/artifacts/timeline-acceptance.json
            opf-render/artifacts/plain-whitespace-browser/**
          retention-days: 7
          if-no-files-found: ignore
      - name: Report the verification boundary
        if: always()
        run: |
          echo 'This job tests coordinated source, local tarballs, and exact published registry installs against pinned fixtures. It executes installed-package browser harnesses, trusted pointer/keyboard editing and undo, controlled code export/reimport, and renderer raster regression checks. Native PowerPoint fidelity, arbitrary document round-tripping and private/public site interactions require separate evidence.' >> "$GITHUB_STEP_SUMMARY"

  installed-portability:
    name: Installed candidates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: opf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: opf
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf-render
          ref: ${{ env.OPF_RENDER_REF }}
          path: opf-render
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf-editor
          ref: ${{ env.OPF_EDITOR_REF }}
          path: opf-editor
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf-pptx
          ref: ${{ env.OPF_PPTX_REF }}
          path: opf-pptx
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: opf/pnpm-lock.yaml
      - name: Bind the installed candidate source graph
        run: >-
          node --input-type=module -e "import {execFileSync} from 'node:child_process'; import {mkdirSync,writeFileSync} from 'node:fs';
          const repos=['opf','opf-render','opf-editor','opf-pptx'].map(name=>({name,head:execFileSync('git',['-C','../'+name,'rev-parse','HEAD'],{encoding:'utf8'}).trim(),tree:execFileSync('git',['-C','../'+name,'rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim()}));
          mkdirSync('artifacts/portability',{recursive:true}); writeFileSync('artifacts/portability/source.json',JSON.stringify({node:process.version,platform:process.platform,arch:process.arch,repos},null,2)+'\n');"
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix ../opf-render
      - run: npm ci --prefix ../opf-editor
      - run: npm ci --prefix ../opf-pptx
      - run: pnpm build
      - run: node scripts/link-ecosystem.mjs --packages-only
      - run: node scripts/pack-ecosystem.mjs
      - run: node -e "if (require('../opf-render/node_modules/playwright/package.json').version !== '1.63.0') throw new Error('Review the pinned browser toolchain.');"
      - run: node ../opf-render/node_modules/playwright/cli.js install chromium
      - run: node scripts/test-packed-ecosystem.mjs
      - run: node scripts/test-packed-types-infrastructure.mjs artifacts/npm/consumer
      - run: node scripts/test-packed-browser.mjs
      - run: node scripts/test-furniture-fields-browser.mjs artifacts/furniture-fields-browser
      - name: Preserve installed portability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-portability-node24-${{ matrix.os }}
          path: |
            opf/artifacts/portability/**
            opf/artifacts/npm/*.tgz
            opf/artifacts/npm/manifest.json
            opf/artifacts/npm/consumer/package.json
            opf/artifacts/npm/consumer/package-lock.json
            opf/artifacts/npm/consumer/packed-types-*.json
            opf/artifacts/npm/consumer/types-smoke.ts
            opf/artifacts/npm/consumer/browser-build-id.json
            opf/artifacts/npm/consumer/artifacts/**
            !opf/artifacts/npm/consumer/artifacts/**/node_modules/**
            opf/artifacts/editor/packed-browser-*
            opf/artifacts/furniture-fields-browser/**
            opf/artifacts/npm/renderer-absent-furniture/**
            opf/artifacts/npm/zip-date-candidate/**
            opf-pptx/artifacts/zip-date/**
          retention-days: 7
          if-no-files-found: ignore
