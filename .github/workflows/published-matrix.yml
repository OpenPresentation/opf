name: Published packages matrix
# RR-04 (FF-09, FF-10, FF-11): the pairwise font-switch matrix, a TypeScript consumer and the determinism grid, run on
# ubuntu, windows and macos against the PUBLISHED packages installed from the npm registry (versions from
# release-plan.json, integrity hashes from the committed consumer lockfile), then compared across the three systems.
# RR-57: a pull request runs only the Linux leg (and no cross-OS comparison) unless it carries the label `full-ci`; add the
# label when a change touches OS-specific code. The merge queue (merge_group) runs all three systems when the entry changes one
# of the paths below (`paths:` does not apply to merge_group, so the first job applies it), instead of the old push-to-main run
# of the commit the queue had just tested. The `labeled` event starts the run without a new push; any other label starts nothing.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'scripts/published-matrix/**'
      - 'scripts/test-font-switch-ecosystem.mjs'
      - 'docs/fixtures/image-treatments.opf.json'
      - 'release-plan.json'
      - '.github/workflows/published-matrix.yml'
  merge_group:
  schedule:
    # Weekly, to notice runner image, registry or ICU drift that no commit caused.
    - cron: '23 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: published-matrix-${{ github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' && 'ignored' || 'run' }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}
env:
  # One Node patch release everywhere: its bundled ICU, Unicode and tz data are then identical on all three systems.
  NODE_VERSION: 24.21.0
jobs:
  # Merge queue only: does this entry change a path above? Any other event answers true.
  scope:
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: paths
        uses: ./.github/actions/paths-changed
        with:
          paths: |
            scripts/published-matrix/**
            scripts/test-font-switch-ecosystem.mjs
            docs/fixtures/image-treatments.opf.json
            release-plan.json
            .github/workflows/published-matrix.yml
  matrix:
    name: Published matrix (${{ matrix.os }})
    needs: scope
    # The Linux leg runs on every path-matching pull request; the other systems only with the label `full-ci`, and in the queue,
    # on the weekly schedule and on workflow_dispatch.
    if: ${{ !cancelled() && (github.event_name != 'merge_group' || needs.scope.outputs.run == 'true') && (github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'full-ci') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # RR-40: Linux is a fixed image (ubuntu-latest moves to Ubuntu 26 from 2026-10-19), so a change of Linux
        # release is a deliberate PR here rather than a surprise in the weekly run.
        # RR-57: a pull request without the label `full-ci` runs the Linux leg only.
        os: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '["ubuntu-24.04","windows-latest","macos-latest"]' || '["ubuntu-24.04"]') }}
    defaults:
      run:
        shell: bash
    env:
      OPF_MATRIX_ENGINES: ${{ github.workspace }}/artifacts/published-matrix/consumer/engines-installed.mjs
      OPF_MATRIX_OUT: ${{ github.workspace }}/artifacts/published-matrix/out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: scripts/published-matrix/consumer/package-lock.json
      - name: Install the published packages and type-check the TypeScript consumer
        run: node scripts/published-matrix/prepare-consumer.mjs
      - name: Run the TypeScript consumer
        run: |
          mkdir -p artifacts/published-matrix/out
          node artifacts/published-matrix/consumer/dist/consumer.js | tee artifacts/published-matrix/out/consumer.json
      - name: Take the font-switch harness of the published core's release tag
        # The published packages are checked with the harness and fixture that shipped with them (the release-plan
        # core's tag): on an unreleased line the checkout's copy already targets the next catalog shape (FA 0.14:
        # font-scheme `languages` ids, `image`/`video` placeholders), which the published catalogs do not have yet.
        # The pairwise step and the determinism grid (scripts/published-matrix/determinism.mjs) both run this copy.
        run: |
          core="$(node -p "require('./release-plan.json').packages.find((entry) => entry.name === '@openpresentation/opf').version")"
          harness="$RUNNER_TEMP/published-harness"
          git fetch --no-tags --depth=1 origin "refs/tags/opf-v$core:refs/tags/opf-v$core"
          # git show, not git archive | tar: GNU tar under Git Bash reads a Windows "D:" path as a remote host.
          for file in scripts/test-font-switch-ecosystem.mjs docs/fixtures/image-treatments.opf.json; do
            mkdir -p "$harness/$(dirname "$file")"
            git show "opf-v$core:$file" > "$harness/$file"
          done
          echo "OPF_FONT_SWITCH_HARNESS=$harness/scripts/test-font-switch-ecosystem.mjs" >> "$GITHUB_ENV"
      - name: Pairwise font-switch matrix
        run: node "$OPF_FONT_SWITCH_HARNESS"
      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/published-matrix/consumer/package-lock.json') }}
      - name: Install headless Chromium (Playwright version pinned by the consumer lockfile)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            node artifacts/published-matrix/consumer/node_modules/playwright/cli.js install --with-deps chromium
          else
            node artifacts/published-matrix/consumer/node_modules/playwright/cli.js install chromium
          fi
      - name: Headless-browser preview re-render (embedded faces, scheme switch, no host fonts)
        run: node scripts/published-matrix/browser-check.mjs
      - name: Determinism grid (time zone, locale, clock, host fonts)
        run: node scripts/published-matrix/determinism.mjs --concurrency 2
      - name: Collect the evidence
        if: always()
        run: |
          cp artifacts/published-matrix/consumer/installed.json artifacts/published-matrix/out/ || true
          cp artifacts/published-matrix/determinism/determinism.json artifacts/published-matrix/out/ || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: published-matrix-${{ matrix.os }}
          path: |
            artifacts/published-matrix/out/digests.json
            artifacts/published-matrix/out/consumer.json
            artifacts/published-matrix/out/installed.json
            artifacts/published-matrix/out/determinism.json
            artifacts/published-matrix/out/browser.json
            artifacts/published-matrix/out/report.json
          retention-days: 14
          if-no-files-found: warn

  compare:
    name: Cross-OS comparison
    needs: matrix
    # RR-57: only when all three systems ran; a Linux-only pull request has nothing to compare.
    if: ${{ always() && needs.matrix.result != 'cancelled' && needs.matrix.result != 'skipped' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: published-matrix-*
          path: compare
      - name: Compare PPTX bytes and SVG and PNG hashes across systems
        run: node scripts/published-matrix/compare.mjs compare --out compare/comparison.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: published-matrix-comparison
          path: compare/comparison.json
          retention-days: 14
          if-no-files-found: warn
