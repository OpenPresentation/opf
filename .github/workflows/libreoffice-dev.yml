# TEMPORARY (deleted before merge): runs the nightly LibreOffice leg on this pull request so it can be iterated without the whole
# slow set. The real leg is the `libreoffice` job of nightly.yml.
name: LibreOffice dev
on:
  pull_request:
permissions:
  contents: read
jobs:
  libreoffice:
    name: LibreOffice qualification (dev)
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    timeout-minutes: 45
    env:
      OPF_LIBREOFFICE_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          container: 'true'
          build-also: '@openpresentation/opf-pptx @openpresentation/opf-render @openpresentation/cli'
      - name: Cache the LibreOffice download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/opf-libreoffice
          key: libreoffice-${{ hashFiles('scripts/libreoffice/environment.json') }}
      - name: Install the pinned LibreOffice
        run: bash scripts/libreoffice/install.sh "$HOME/.cache/opf-libreoffice"
      # The release qualification corpus (scripts/native-acceptance/qualification): the same PPTX files the PowerPoint and Keynote runs open.
      - name: Build the release qualification corpus
        run: |
          # TEMPORARY: the corpus is on its own branch (opf#1085) until it merges.
          if [ ! -f scripts/native-acceptance/qualification/build.mjs ]; then
            git fetch --depth 1 origin codex/rr-qual-0.33-windows && git checkout FETCH_HEAD -- scripts/native-acceptance/qualification
          fi
          if [ -f scripts/native-acceptance/qualification/build.mjs ]; then
            node scripts/native-acceptance/qualification/build.mjs --out artifacts/qualification
          fi

      - name: Qualify the export
        run: |
          args=(--out artifacts/libreoffice)
          if [ -f artifacts/qualification/build.json ]; then args+=(--qualification artifacts/qualification); fi
          node scripts/libreoffice/run.mjs "${args[@]}"
      - name: Preserve the results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libreoffice-qualification
          path: |
            artifacts/libreoffice/**
            !artifacts/libreoffice/profiles/*/lo-user/**
            !artifacts/libreoffice/profiles/*/fonts/**
            !artifacts/libreoffice/profiles/*/cache/**
          retention-days: 7
          if-no-files-found: warn
