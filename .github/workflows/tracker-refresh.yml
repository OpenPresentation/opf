name: Tracker refresh

# RR-46: the generated trackers (gallery-tracker.*, font-tracker.*) are derived from committed data. A pull request
# need not regenerate them (CI only warns about a stale one), so after every push to main this workflow rebuilds them
# and, if they changed, pushes the result to the branch bot/tracker-refresh and opens (or updates) one pull request.
#
# The GitHub Actions token cannot push to main (the ruleset requires a pull request) and, with the repository setting
# "Allow GitHub Actions to create and approve pull requests" off, cannot open the pull request either. Until the GitHub
# App of opf#298 exists, the job therefore ends with a notice that carries the compare link: open the pull request from
# it (a person, or the supervisor with `gh api repos/OpenPresentation/opf/pulls`). With the App token the job opens the
# pull request itself and can enable auto-merge; swap `github.token` for the App token below.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One refresh at a time; a newer push to main supersedes the branch contents, so queued runs are not cancelled midway.
concurrency:
  group: tracker-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Regenerate the trackers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # The font tracker first: the gallery tracker reads it. Both scripts use only Node and committed data.
      - name: Regenerate
        run: |
          node scripts/build-font-tracker.mjs
          node scripts/build-gallery-tracker.mjs

      - name: Publish the refresh branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "The trackers are current at $(git rev-parse --short HEAD)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --stat | tee -a "$GITHUB_STEP_SUMMARY"
          branch=bot/tracker-refresh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -u
          git commit -m "Regenerate the gallery and font trackers ($(git rev-parse --short origin/main))"
          git push --force origin "$branch"
          title="Regenerate the gallery and font trackers"
          body="Generated by tracker-refresh.yml from main $(git rev-parse --short origin/main): \`node scripts/build-font-tracker.mjs && node scripts/build-gallery-tracker.mjs\`. No hand edits; see CONTRIBUTING.md, Generated trackers."
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" ]; then
            echo "A refresh pull request is already open; its branch now holds the latest regeneration." | tee -a "$GITHUB_STEP_SUMMARY"
          elif gh pr create --base main --head "$branch" --title "$title" --body "$body"; then
            echo "Opened the refresh pull request." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            link="https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
            echo "::notice title=Tracker refresh needs a pull request::main's generated trackers are stale. The regenerated files are on ${branch}; open the pull request: ${link}"
            echo "Actions cannot open the pull request here (opf#298). Open it from: ${link}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
