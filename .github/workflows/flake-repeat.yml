name: Flake measurement
# RR-47: runs the installed-tarball browser checks of the coordinated packages job five times on main and records a pass rate
# per test (job summary and the flake-repeat artifact). It measures; it does not gate. Quarantine rule: test/QUARANTINE.md.
on:
  schedule:
    - cron: '23 3 * * *'
  # A change to this workflow runs it once, so the change is verified before it reaches main (a new workflow cannot be dispatched until then).
  pull_request:
    paths: ['.github/workflows/flake-repeat.yml']
  workflow_dispatch:
    inputs:
      repeat:
        description: Runs per test
        default: '5'
permissions:
  contents: read
concurrency:
  group: flake-repeat-${{ github.ref }}
  cancel-in-progress: false
jobs:
  repeat:
    name: Repeat installed-browser checks
    runs-on: ubuntu-latest
    # The same image as the coordinated packages job (Playwright 1.63.0, Chromium and its libraries).
    container: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: opf
          fetch-depth: 0
          persist-credentials: false
      # The sibling pins are the ones the packages job uses: one source of truth.
      - name: Read the sibling pins of the packages job
        run: grep -E '^  OPF_(RENDER|EDITOR|PPTX)_REF: [0-9a-f]{40}$' opf/.github/workflows/ecosystem-ci.yml | sed 's/^ *//; s/: /=/' | tee -a "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf-render
          ref: ${{ env.OPF_RENDER_REF }}
          path: opf-render
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf-editor
          ref: ${{ env.OPF_EDITOR_REF }}
          path: opf-editor
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf-pptx
          ref: ${{ env.OPF_PPTX_REF }}
          path: opf-pptx
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: opf/pnpm-lock.yaml
      - name: Install locked dependencies
        run: |
          pnpm --dir opf install --frozen-lockfile
          for repo in opf-render opf-editor opf-pptx; do
            npm ci --prefix "$repo"
          done
      # What the packages job builds before its browser step: sources, the editor demo and rich-table bundle, tarballs, the consumer.
      - name: Build, link and pack the coordinated sources
        working-directory: opf
        run: |
          pnpm build
          node scripts/link-ecosystem.mjs --packages-only
          pnpm demo:editor
          node scripts/build-rich-table-browser.mjs
          pnpm pack:ecosystem
          pnpm test:packed-ecosystem
      - name: Repeat the installed-browser suite
        working-directory: opf
        env:
          REPEAT: ${{ inputs.repeat || '5' }}
        run: node scripts/flake-repeat.mjs --suite installed-browser --repeat "$REPEAT" --out artifacts/flake-repeat
      - name: Preserve the measurement
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flake-repeat-installed-browser
          path: opf/artifacts/flake-repeat/**
          retention-days: 30
          if-no-files-found: warn
