name: Publish OPF gallery
# RR-78: @openpresentation/gallery (packages/gallery) is released on its own version line, outside the lockstep train
# (docs/release-process.md, "The gallery lane"). A `gallery-vX.Y.Z` tag on a release commit of main publishes that
# version with npm trusted publishing (OIDC, --provenance). A manual run executes every gate and publishes nothing.
on:
  push:
    tags: [gallery-v*]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-gallery
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.16.0
      - run: pnpm install --frozen-lockfile
      # The tag names the version: a gallery-v tag whose version is not packages/gallery/package.json's is refused, and
      # so is a package whose repository is not this one (npm provenance must name OpenPresentation/opf).
      - name: Verify release tag and package identity
        run: |
          VERSION="$(node -p "require('./packages/gallery/package.json').version")"
          REPOSITORY="$(node -p "const r = require('./packages/gallery/package.json').repository; r.url + ' ' + r.directory")"
          test "${REPOSITORY}" = "git+https://github.com/OpenPresentation/opf.git packages/gallery" || { echo "packages/gallery/package.json repository is '${REPOSITORY}'"; exit 1; }
          case "${GITHUB_REF}" in
            refs/tags/*)
              if [ "${GITHUB_REF_NAME}" != "gallery-v${VERSION}" ]; then
                echo "Tag ${GITHUB_REF_NAME} does not match @openpresentation/gallery version ${VERSION} (expected gallery-v${VERSION})."
                exit 1
              fi
              ;;
            *) echo "Not a tag run: every gate runs, nothing is published." ;;
          esac
      - run: pnpm lint
      - name: Records match their manifest and core's copies
        run: pnpm check:catalog
      - name: Build and test the package
        run: pnpm check:gallery
      # RR-78: a minor or patch release draws every existing record exactly as the previous published release does and
      # removes no id; only a major release may (packages/gallery/scripts/stability.mjs).
      - name: Pixel stability against the previous published release
        run: pnpm check:gallery-stability
      - name: Verify npm package contents
        run: pnpm --filter @openpresentation/gallery pack:dry-run
      # npm's trusted publisher for @openpresentation/gallery: OpenPresentation/opf, workflow gallery-publish.yml, no
      # environment. No long-lived npm token is used.
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/gallery-v')
        working-directory: packages/gallery
        run: npm publish --access public --provenance
