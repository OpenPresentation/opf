# Opt-in local graph qualification. Original manifests/locks are never registry-adopted here.
name: Candidate gallery qualification
on:
  workflow_call:
    inputs:
      gallery-ref:
        type: string
        required: true
      mode:
        type: string
        required: true
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    timeout-minutes: 75
    env:
      OPF_TRACKER_STALE: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'warn' || 'fail' }}
      OPF_REUSE_BUILD: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - name: Require an explicit qualification scope
        env:
          MODE: ${{ inputs.mode }}
        run: test "$MODE" = core || test "$MODE" = ecosystem
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: opf
          fetch-depth: 0
          persist-credentials: false
      - id: refs
        uses: ./opf/.github/actions/ecosystem-refs
        with:
          consumer: opf
          export-golden: 'true'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: OpenPresentation/opf-render
          ref: ${{ steps.refs.outputs.opf_render }}
          path: opf-render
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: OpenPresentation/opf-pptx
          ref: ${{ steps.refs.outputs.opf_pptx }}
          path: opf-pptx
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: OpenPresentation/opf-editor
          ref: ${{ steps.refs.outputs.opf_editor }}
          path: opf-editor
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.33.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node || 24 }}
          cache: pnpm
          cache-dependency-path: opf/pnpm-lock.yaml
      - name: Pin the reviewed package manager
        run: npm install --global npm@11.16.0
      - name: Install original locked source dependencies
        shell: bash
        run: |
          pnpm --dir opf install --frozen-lockfile
          for repo in opf-render opf-pptx opf-editor; do npm ci --prefix "$repo"; done
      - id: gallery
        uses: ./opf/.github/actions/candidate-gallery
        with:
          candidate-gallery-ref: ${{ inputs.gallery-ref }}
      - name: Require the caller's exact authorized gallery
        shell: bash
        env:
          EXPECTED: ${{ inputs.gallery-ref }}
          RESOLVED: ${{ steps.gallery.outputs.sha }}
        run: test -n "$EXPECTED" && test "$RESOLVED" = "$EXPECTED"
      - name: Preserve complete ecosystem policy contracts
        if: inputs.mode == 'ecosystem'
        working-directory: opf
        run: |
          node --test scripts/ecosystem-scope.test.mjs scripts/package-ecosystem-plan.test.mjs
          node --test scripts/quarantine.test.mjs
          node scripts/quarantine.mjs check
          node --test scripts/ecosystem-lock.test.mjs scripts/ecosystem-roll.test.mjs
          node scripts/ecosystem-lock.mjs validate
      - name: Preserve the existing ecosystem lock guard
        if: inputs.mode == 'ecosystem'
        working-directory: opf
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ECOSYSTEM_LOCK_GUARD: ${{ vars.ECOSYSTEM_LOCK_GUARD }}
        run: |
          args=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git show HEAD^1:ecosystem.lock.json > "$RUNNER_TEMP/base-ecosystem.lock.json" 2>/dev/null; then
            args+=(--base-lock "$RUNNER_TEMP/base-ecosystem.lock.json")
          fi
          node scripts/ecosystem-lock.mjs guard "${args[@]}"
      - name: Build, validate gallery source, and stage exact candidate tarballs
        working-directory: opf
        run: node scripts/candidate-gallery-build.mjs
      - name: Complete source core contracts and unchanged breaking gate
        if: inputs.mode == 'core'
        working-directory: opf
        run: |
          pnpm audit
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm check:examples
          pnpm check:breaking
          pnpm --filter @openpresentation/opf pack:dry-run
          node packages/javascript/test/packed-install-smoke.mjs
          pnpm test:cli:packed
          pnpm test:cli:packed:peers
      # The published developer quickstart runs in the control using its published source fixture.
      # Candidate source fixtures must not be substituted into the 0.18 registry contract.
      - name: Complete linked ecosystem and installed tarball contracts
        if: inputs.mode == 'ecosystem'
        working-directory: opf
        run: |
          node scripts/test-package-ecosystem.mjs --tier full
          node scripts/test-packed-types-infrastructure.mjs artifacts/npm/consumer
          node -e "if (require('../opf-render/node_modules/playwright/package.json').version !== '1.63.0') throw new Error('Review the pinned Playwright image.');"
          node scripts/quarantine.mjs run-suite installed-browser
          node --test scripts/metric-outline-ink.test.mjs
          node scripts/test-metric-outline-browser.mjs artifacts/metric-outline-browser
          node scripts/quarantine.mjs run-deferred
      # These commands already select immutable released sibling fixtures via release-plan verificationRefs.
      # They qualify genuine installed registry bytes separately from the candidate source/tarballs above.
      - name: Existing published registry fixtures and candidate core geometry with verified registry fonts
        if: inputs.mode == 'ecosystem'
        working-directory: opf
        env:
          CANDIDATE_GALLERY_REF: ''
        run: |
          pnpm test:registry-ecosystem
          pnpm test:layout-contracts:registry
          pnpm test:packed-browser registry
          editor_gate="$(node scripts/registry-sibling-gate.mjs ../opf-editor artifacts/npm/registry-consumer)"
          if [ "$editor_gate" = run ]; then node ../opf-editor/test/json-editor-browser.mjs artifacts/editor/json-editor-registry.json artifacts/npm/registry-consumer; fi
          node scripts/test-packed-browser-guards.mjs
          node scripts/test-installed-code-guards.mjs --registry
          pnpm test:registry-fidelity
          node packages/cli/test/packed.mjs --registry
          node scripts/test-quote-layout-geometry.mjs artifacts/npm/registry-consumer artifacts/quote-layout-geometry.json
          node scripts/test-code-layout-geometry.mjs artifacts/npm/registry-consumer artifacts/code-layout-geometry.json
          node scripts/test-code-layout-browser.mjs artifacts/npm/registry-consumer artifacts/code-layout-geometry.json artifacts/code-layout-browser.json
          node scripts/test-metric-registry-guards.mjs artifacts/npm/registry-consumer
          node scripts/test-metric-layout-geometry.mjs artifacts/npm/registry-consumer artifacts/metric-layout-geometry.json
          node scripts/test-metric-layout-browser.mjs artifacts/npm/registry-consumer artifacts/metric-layout-geometry.json artifacts/metric-layout-browser.json
      - name: Renderer browser source contracts
        if: inputs.mode == 'ecosystem'
        working-directory: opf-render
        run: |
          node test/plain-whitespace-browser.mjs artifacts/plain-whitespace-browser
          npm run test:font-variants-browser
      - name: Preserve explicit candidate provenance and contract evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-gallery-${{ inputs.mode }}-${{ matrix.os || 'linux' }}-${{ matrix.node || 24 }}
          path: |
            opf/artifacts
            opf-render/artifacts
            opf-pptx/artifacts
            opf-editor/artifacts
          retention-days: 14
          if-no-files-found: error
  engines:
    if: inputs.mode == 'core'
    env:
      OPF_REUSE_BUILD: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.node }}
      OPF_TRACKER_STALE: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'warn' || 'fail' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [22, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: opf
          fetch-depth: 0
          persist-credentials: false
      - id: refs
        uses: ./opf/.github/actions/ecosystem-refs
        with:
          consumer: opf
          export-golden: 'true'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: OpenPresentation/opf-render
          ref: ${{ steps.refs.outputs.opf_render }}
          path: opf-render
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: OpenPresentation/opf-pptx
          ref: ${{ steps.refs.outputs.opf_pptx }}
          path: opf-pptx
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: OpenPresentation/opf-editor
          ref: ${{ steps.refs.outputs.opf_editor }}
          path: opf-editor
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.33.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node || 24 }}
          cache: pnpm
          cache-dependency-path: opf/pnpm-lock.yaml
      - name: Pin the reviewed package manager
        run: npm install --global npm@11.16.0
      - name: Install original locked source dependencies
        shell: bash
        run: |
          pnpm --dir opf install --frozen-lockfile
          for repo in opf-render opf-pptx opf-editor; do npm ci --prefix "$repo"; done
      - id: gallery
        uses: ./opf/.github/actions/candidate-gallery
        with:
          candidate-gallery-ref: ${{ inputs.gallery-ref }}
      - name: Require the caller's exact authorized gallery
        shell: bash
        env:
          EXPECTED: ${{ inputs.gallery-ref }}
          RESOLVED: ${{ steps.gallery.outputs.sha }}
        run: test -n "$EXPECTED" && test "$RESOLVED" = "$EXPECTED"
      - name: Build, validate gallery source, and stage exact candidate tarballs
        working-directory: opf
        run: node scripts/candidate-gallery-build.mjs
      - name: Complete package contracts on supported engines
        working-directory: opf
        run: |
          pnpm test
          node packages/javascript/test/packed-install-smoke.mjs
          pnpm test:cli:packed
          pnpm test:cli:packed:peers
      - name: Preserve explicit candidate provenance and contract evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-gallery-${{ inputs.mode }}-${{ matrix.os || 'linux' }}-${{ matrix.node || 24 }}
          path: |
            opf/artifacts
            opf-render/artifacts
            opf-pptx/artifacts
            opf-editor/artifacts
          retention-days: 14
          if-no-files-found: error
