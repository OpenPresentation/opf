name: Publish OPF npm package

on:
  push:
    tags:
      - "opf-v*"
      - "@openpresentation/opf@v*"
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish @openpresentation/opf
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Use a trusted-publishing capable npm
        run: npm install -g npm@11.16.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(node -p "require('./packages/javascript/package.json').version")"
          case "${GITHUB_REF_NAME}" in
            "opf-v${VERSION}"|"@openpresentation/opf@v${VERSION}") ;;
            *)
              echo "Tag ${GITHUB_REF_NAME} does not match @openpresentation/opf version ${VERSION}."
              exit 1
              ;;
          esac

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Check breaking changes against the previous release
        run: pnpm check:breaking

      - name: Verify npm package contents
        run: pnpm --filter @openpresentation/opf pack:dry-run

      - name: Verify examples and portable skills
        run: |
          pnpm check:examples
          pnpm test:skills

      - name: Verify isolated packed installation
        run: node packages/javascript/test/packed-install-smoke.mjs

      - name: Publish to npm
        working-directory: packages/javascript
        run: npm publish --access public --provenance

  release:
    name: Create GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="$(echo "${GITHUB_REF_NAME}" | sed -E 's/^(opf-v|@openpresentation\/opf@v)//')"
          NOTES_FILE="$(mktemp)"

          awk -v ver="## ${VERSION}" '
            $0 == ver { found=1; next }
            /^## / { if (found) exit }
            found { print }
          ' CHANGELOG.md > "${NOTES_FILE}"

          # Trim leading/trailing blank lines.
          sed -i -e '/./,$!d' -e ':a' -e '/^\n*$/{$d;N;ba' -e '}' "${NOTES_FILE}"

          if [ ! -s "${NOTES_FILE}" ]; then
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) for details." > "${NOTES_FILE}"
          fi

          echo "NOTES_FILE=${NOTES_FILE}" >> "${GITHUB_ENV}"
          echo "RELEASE_VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "@openpresentation/opf ${RELEASE_VERSION}" \
            --notes-file "${NOTES_FILE}" \
            --verify-tag
