name: Publish OPF npm package

on:
  push:
    tags:
      - "opf-v*"
      - "@openpresentation/opf@v*"
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish @openpresentation/opf
    runs-on: ubuntu-latest
    # RR-100: no test re-run; install, build, pack and the packed-install smoke take about 5 minutes.
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          fetch-depth: 0

      - name: Verify merged release source
        run: node scripts/publish-source.mjs --manifest packages/javascript/package.json --tag-prefix opf-v --tag-prefix @openpresentation/opf@v

      # RR-100: the tagged commit's own CI is the evidence (scripts/ci-evidence.mjs, scripts/ci-evidence.json): its merge-queue runs
      # must have succeeded with the required checks of the main ruleset. Nothing is re-tested below; the steps that remain build and
      # verify the artifact itself. Fails closed: a missing, running or failed check means no publish.
      - name: Verify the CI evidence of this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-evidence.mjs --sha "$(git rev-parse HEAD)"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Use a trusted-publishing capable npm
        run: npm install -g npm@11.16.0

      - name: Reject unresolved candidate gallery publication
        run: node scripts/candidate-gallery.mjs publication

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # RR-100: lint, typecheck, the tests, the breaking-change check, the examples and the skills ran in CI on this exact commit.
      - name: Build
        run: pnpm build

      - name: Verify npm package contents
        run: pnpm --filter @openpresentation/opf pack:dry-run

      # RR-100: the portable skills test runs only here (not in CI), so it stays.
      - name: Verify portable skills
        run: pnpm test:skills

      - name: Verify isolated packed installation
        run: node packages/javascript/test/packed-install-smoke.mjs

      - name: Publish to npm
        working-directory: packages/javascript
        run: npm publish --access public --provenance

  release:
    name: Create GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="$(echo "${GITHUB_REF_NAME}" | sed -E 's/^(opf-v|@openpresentation\/opf@v)//')"
          NOTES_FILE="$(mktemp)"

          # Matches `## X.Y.Z` and `## X.Y.Z (date)`, the form the changelog assembler writes.
          node scripts/release-notes.mjs --version "${VERSION}" --out "${NOTES_FILE}"

          if [ ! -s "${NOTES_FILE}" ]; then
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) for details." > "${NOTES_FILE}"
          fi

          echo "NOTES_FILE=${NOTES_FILE}" >> "${GITHUB_ENV}"
          echo "RELEASE_VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --json tagName >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; preserving its notes."
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "@openpresentation/opf ${RELEASE_VERSION}" \
              --notes-file "${NOTES_FILE}" \
              --verify-tag
          fi
