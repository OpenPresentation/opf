name: Published runtime and reviewed registry graph control
on:
  workflow_call:
    inputs:
      tools-ref:
        type: string
        required: false
        default: ''
      mode:
        type: string
        required: true
      opf-ref:
        type: string
        required: true
      render-ref:
        type: string
        required: true
      pptx-ref:
        type: string
        required: true
      editor-ref:
        type: string
        required: true
      cli-ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  control:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    timeout-minutes: 75
    env:
      CANDIDATE_GALLERY_REF: ''
      OPF_TRACKER_STALE: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'warn' || 'fail' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: OpenPresentation/opf
          ref: ${{ inputs.tools-ref || github.sha }}
          fetch-depth: 0
          path: tools
          persist-credentials: false
      - name: Verify exact selected core tools commit
        env:
          TOOLS_REF: ${{ inputs.tools-ref || github.sha }}
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          assert.match(process.env.TOOLS_REF,/^[0-9a-f]{40}$/);
          assert.equal(execFileSync('git',['-C','tools','rev-parse','HEAD'],{encoding:'utf8'}).trim(),process.env.TOOLS_REF);
          JS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: OpenPresentation/opf
          ref: ${{ inputs.opf-ref }}
          path: opf
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: OpenPresentation/opf-render
          ref: ${{ inputs.render-ref }}
          path: opf-render
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: OpenPresentation/opf-pptx
          ref: ${{ inputs.pptx-ref }}
          path: opf-pptx
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: OpenPresentation/opf-editor
          ref: ${{ inputs.editor-ref }}
          path: opf-editor
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: OpenPresentation/opf
          ref: ${{ inputs.cli-ref }}
          path: cli-source
          fetch-depth: 0
          persist-credentials: false
      - name: Independently bind published source to the reviewed current registry graph
        env:
          MODE: ${{ inputs.mode }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {publishedGalleryControl,readRegularJson} from './tools/scripts/candidate-gallery.mjs';
          assert.ok(['core','ecosystem'].includes(process.env.MODE));
          const plan=readRegularJson('tools/release-plan.json'),refs=await publishedGalleryControl(plan);
          for(const [repo,sha] of Object.entries(refs)){
            if(repo==='cli'){assert.equal(execFileSync('git',['-C','cli-source','rev-parse','HEAD'],{encoding:'utf8'}).trim(),sha);assert.equal(readRegularJson('cli-source/packages/cli/package.json').version,plan.packages.find(item=>item.name==='@openpresentation/cli').version);continue;}
            assert.equal(execFileSync('git',['-C',repo,'rev-parse','HEAD'],{encoding:'utf8'}).trim(),sha);
            const file=repo==='opf'?`${repo}/packages/javascript/package.json`:`${repo}/package.json`;
            assert.equal(readRegularJson(file).version,plan.packages.find(item=>item.name===`@openpresentation/${repo}`).version);
          }
          JS
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.33.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: opf/pnpm-lock.yaml
      - name: Pin the reviewed package manager
        run: npm install --global npm@11.16.0
      - name: Stage the reviewed registry plan and pinned test-tooling bridge with original evidence
        run: node tools/scripts/candidate-gallery-control.mjs stage tools opf
      - name: Original published source locks and builds
        run: |
          pnpm --dir opf install --frozen-lockfile
          for repo in opf-render opf-pptx opf-editor; do npm ci --prefix "$repo"; done
          cd opf
          pnpm build
      - name: Published runtime and recorded test-tooling contracts
        if: inputs.mode == 'core'
        working-directory: opf
        run: |
          pnpm audit
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm check:examples
          pnpm check:breaking
          pnpm --filter @openpresentation/opf pack:dry-run
          node packages/javascript/test/packed-install-smoke.mjs
          pnpm test:cli:packed
          node packages/cli/test/packed.mjs --registry
          pnpm test:cli:packed:peers
          pnpm test:developer-quickstart
      - name: Published linked runtime, installed and registry contracts
        if: inputs.mode == 'ecosystem'
        working-directory: opf
        run: |
          node scripts/link-ecosystem.mjs --packages-only
          node scripts/test-package-ecosystem.mjs --tier full
          node scripts/test-packed-types-infrastructure.mjs artifacts/npm/consumer
          node scripts/quarantine.mjs run-suite installed-browser
          node --test scripts/metric-outline-ink.test.mjs
          node scripts/test-metric-outline-browser.mjs artifacts/metric-outline-browser
          pnpm test:registry-ecosystem
          pnpm test:layout-contracts:registry
          pnpm test:packed-browser registry
          node ../opf-editor/test/json-editor-browser.mjs artifacts/editor/json-editor-registry.json artifacts/npm/registry-consumer
          node scripts/test-packed-browser-guards.mjs
          node scripts/test-installed-code-guards.mjs --registry
          pnpm test:registry-fidelity
          node packages/cli/test/packed.mjs --registry
          node scripts/test-quote-layout-geometry.mjs artifacts/npm/registry-consumer artifacts/quote-layout-geometry.json
          node scripts/test-code-layout-geometry.mjs artifacts/npm/registry-consumer artifacts/code-layout-geometry.json
          node scripts/test-code-layout-browser.mjs artifacts/npm/registry-consumer artifacts/code-layout-geometry.json artifacts/code-layout-browser.json
          node scripts/test-metric-registry-guards.mjs artifacts/npm/registry-consumer
          node scripts/test-metric-layout-geometry.mjs artifacts/npm/registry-consumer artifacts/metric-layout-geometry.json
          node scripts/test-metric-layout-browser.mjs artifacts/npm/registry-consumer artifacts/metric-layout-geometry.json artifacts/metric-layout-browser.json
      - name: Verify exact recorded metadata/tooling boundary and unchanged published runtime
        run: |
          node tools/scripts/candidate-gallery-control.mjs verify tools opf
          for repo in opf-render opf-pptx opf-editor cli-source; do git -C "$repo" diff --exit-code HEAD; done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: published-control-${{ inputs.mode }}
          path: |
            opf/artifacts
            opf-render/artifacts
            opf-pptx/artifacts
            opf-editor/artifacts
          retention-days: 14
          if-no-files-found: error
