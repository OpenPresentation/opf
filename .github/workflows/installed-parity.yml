name: Installed parity audit
# RR-04 (FF-38): the preview-versus-PPTX parity harness (docs/programs/font-fidelity-everywhere/gallery-support/parity) run on
# ubuntu, windows and macos against the PUBLISHED packages installed from the npm registry (versions from release-plan.json),
# then compared across the three systems: same values, same class, same outcome of every check. The harness itself is
# unchanged; PARITY_FONT_HOST=gallery models the gallery editor's bundled font host, so no host font is read.
# Not a required check, so the path filter below cannot leave a required status pending (docs/programs/release-readiness/ci-cd.md, section 1).
# RR-57: a pull request runs only the Linux leg (and no cross-OS comparison) unless it carries the label `full-ci`; add the
# label when a change touches OS-specific code. The merge queue (merge_group) runs all three systems when the entry changes one
# of the paths below (`paths:` does not apply to merge_group, so the first job applies it), instead of the old push-to-main run
# of the commit the queue had just tested. The `labeled` event starts the run without a new push; any other label starts nothing.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/workflows/installed-parity.yml'
      - 'scripts/published-matrix/installed-parity.mjs'
      - 'scripts/published-matrix/compare-parity.mjs'
      - 'scripts/published-matrix/fixtures/**'
      - 'docs/programs/font-fidelity-everywhere/gallery-support/parity/scripts/**'
      - 'release-plan.json'
  merge_group:
  schedule:
    # Weekly, with the published matrix, to notice registry, runner image or dependency drift that no commit caused.
    - cron: '41 5 * * 1'
  workflow_dispatch:
    inputs:
      overrides:
        description: 'Replace planned versions, e.g. "@openpresentation/opf-pptx@0.14.0" (default: release-plan.json)'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: installed-parity-${{ github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' && 'ignored' || 'run' }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}
env:
  # The same Node patch release as the published matrix: identical ICU, Unicode and tz data on all three systems.
  NODE_VERSION: 24.21.0
  # Planned versions are release-plan.json; this replaces entries the plan does not carry yet.
  OPF_PARITY_OVERRIDES: ${{ inputs.overrides || vars.OPF_PARITY_OVERRIDES || '' }}
jobs:
  # Merge queue only: does this entry change a path above? Any other event answers true.
  scope:
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: paths
        uses: ./.github/actions/paths-changed
        with:
          paths: |
            .github/workflows/installed-parity.yml
            scripts/published-matrix/installed-parity.mjs
            scripts/published-matrix/compare-parity.mjs
            scripts/published-matrix/fixtures/**
            docs/programs/font-fidelity-everywhere/gallery-support/parity/scripts/**
            release-plan.json
  parity:
    name: Installed parity (${{ matrix.os }})
    needs: scope
    # The Linux leg runs on every path-matching pull request; the other systems only with the label `full-ci`, and in the queue,
    # on the weekly schedule and on workflow_dispatch.
    if: ${{ !cancelled() && (github.event_name != 'merge_group' || needs.scope.outputs.run == 'true') && (github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'full-ci') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # RR-57: a pull request without the label `full-ci` runs the Linux leg only.
        os: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '["ubuntu-24.04","windows-latest","macos-latest"]' || '["ubuntu-24.04"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The work directory is installed-parity under RUNNER_TEMP, outside the checkout, so the harness reads the registry
      # gitHead of each package and not the HEAD of this repository.
      - name: Install the published packages and lay out the harness
        run: node scripts/published-matrix/installed-parity.mjs prepare
      - name: Gallery value documents (committed snapshot of the gallery's own builders)
        run: node scripts/published-matrix/installed-parity.mjs snippets
      - name: Parity audit (PARITY_FONT_HOST=gallery)
        run: node scripts/published-matrix/installed-parity.mjs parity
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: installed-parity-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/installed-parity/out/parity-results.json
            ${{ runner.temp }}/installed-parity/out/PARITY.md
            ${{ runner.temp }}/installed-parity/out/installed.json
          retention-days: 14
          if-no-files-found: warn

  compare:
    name: Cross-OS comparison
    needs: parity
    # RR-57: only when all three systems ran; a Linux-only pull request has nothing to compare.
    if: ${{ always() && needs.parity.result != 'cancelled' && needs.parity.result != 'skipped' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installed-parity-*
          path: compare
      - name: Compare classes and checks across systems
        run: node scripts/published-matrix/compare-parity.mjs compare --out compare/comparison.json --markdown compare/comparison.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: installed-parity-comparison
          path: |
            compare/comparison.json
            compare/comparison.md
          retention-days: 14
          if-no-files-found: warn
