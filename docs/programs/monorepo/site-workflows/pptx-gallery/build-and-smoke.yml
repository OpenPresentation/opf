name: Build and smoke

# MR-52 (OpenPresentation/opf, docs/programs/monorepo/README.md, section 6, decision D19). The check `build-and-smoke` that
# opf-bump-merge.yml waits for before it merges a patch bump of the OpenPresentation/opf packages ("bump to vX.Y.Z", branch bot/opf-v*,
# opened by the OPF release bot). It runs for those bump branches only; every other pull request is unaffected (Validate gallery registry
# still runs for all of them). Widen the `if` below to run it for every pull request if wanted.
#
# The steps are the part of validate-gallery-registry.yml that needs no secret and no production URL, plus the checks of everything a bump
# regenerates (the package catalog, layout and chart previews, preview fonts, font replacements, the vendored editor bundle: a bump whose
# generated files were not refreshed for the new versions fails here and stays open), the unit tests, the production build and a smoke of
# the built site (the editor entry URLs). Keep the workflow name and the job name in step with `workflows:` and REQUIRED_CHECKS of
# opf-bump-merge.yml.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-and-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: build-and-smoke
    if: ${{ startsWith(github.head_ref, 'bot/opf-v') && github.event.pull_request.head.repo.full_name == github.repository }}
    # RR-40: a fixed image, as in the other workflows of this repository.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm lint

      - name: Package catalog, preview and font invariants
        run: |
          pnpm check:core-catalog
          pnpm verify:layout-previews
          pnpm verify:chart-previews
          pnpm verify:font-replacements
          pnpm verify:preview-fonts
          pnpm test:package-catalog

      - name: Vendored editor against the pinned packages
        run: |
          pnpm prepare:script-fonts
          pnpm prepare:lazy-fonts
          pnpm prepare:editor-wasm
          pnpm verify:published-editor

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Built editor entry URLs and assets
        run: |
          pnpm start --hostname 127.0.0.1 --port 3135 > /tmp/gallery-editor-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3135/editor > /dev/null; then break; fi
            sleep 1
          done
          GALLERY_BASE=http://127.0.0.1:3135 pnpm verify:editor-entry
