name: Publish gallery
# A `vX.Y.Z` tag on a commit of main publishes @openpresentation/gallery X.Y.Z with npm trusted publishing (OIDC,
# --provenance). The tag must equal `v` + package.json's version, and package.json's repository must be this one. A manual
# run (workflow_dispatch) runs every gate and publishes nothing.
#
# npm trusted publisher: GitHub Actions, organization OpenPresentation, repository gallery, workflow gallery-publish.yml,
# no environment. No npm token is used.
on:
  push:
    tags: [v*]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-gallery
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.16.0
      - run: npm ci
      - name: Verify the tag, the version and the repository
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          REPOSITORY="$(node -p "const r = require('./package.json').repository; (r.url ?? '') + ' ' + (r.directory ?? '-')")"
          test "${REPOSITORY}" = "git+https://github.com/OpenPresentation/gallery.git -" || { echo "package.json repository is '${REPOSITORY}', not OpenPresentation/gallery"; exit 1; }
          test "${GITHUB_REPOSITORY}" = "OpenPresentation/gallery" || { echo "This workflow publishes only from OpenPresentation/gallery, not ${GITHUB_REPOSITORY}."; exit 1; }
          case "${GITHUB_REF}" in
            refs/tags/*)
              if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
                echo "Tag ${GITHUB_REF_NAME} does not match @openpresentation/gallery version ${VERSION} (expected v${VERSION})."
                exit 1
              fi
              git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || { echo "Tag ${GITHUB_REF_NAME} is not on main."; exit 1; }
              ;;
            *) echo "Not a tag run: every gate runs, nothing is published." ;;
          esac
      - run: npm run check:license
      - run: npm run verify
      - run: npm test
      - run: npm run typecheck
      - name: Pixel stability against the previous published release
        run: npm run check:stability
      - run: npm run pack:dry-run
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --access public --provenance
