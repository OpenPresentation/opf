<svg aria-label="Three steps from evidence to decision" aria-roledescription="slide" height="720" role="group" viewBox="0 0 1280 720" width="1280" xmlns="http://www.w3.org/2000/svg">
<rect aria-hidden="true" fill="#FFFFFF" height="720" opacity="1" width="1280" x="0" y="0"/>
<g><text fill="#000000" font-family="Aptos Display, sans-serif" font-size="54" font-weight="700" style="white-space:pre" text-anchor="start" x="57.6" xml:space="preserve" y="111.6">Three steps from evidence to decision</text></g>
<g><text aria-hidden="true" fill="#000000" font-family="Aptos, sans-serif" font-size="37" x="57.6" y="314.707">1.</text>
<g><text font-family="Aptos, sans-serif" font-size="37" font-weight="400" text-anchor="start" x="111.62" xml:space="preserve" y="314.707"><tspan fill="#000000" font-family="Aptos, sans-serif" font-size="37" font-style="normal" font-weight="400" xml:space="preserve">Establish a </tspan></text>
<text font-family="Aptos, sans-serif" font-size="37" font-weight="400" text-anchor="start" x="111.62" xml:space="preserve" y="359.847"><tspan fill="#000000" font-family="Aptos, sans-serif" font-size="37" font-style="normal" font-weight="400" xml:space="preserve">baseline</tspan></text></g>
<g><text font-family="Aptos, sans-serif" font-size="30.333" font-weight="400" text-anchor="start" x="111.62" xml:space="preserve" y="402.76"><tspan fill="#011842" font-family="Aptos, sans-serif" font-size="30.333" font-style="normal" font-weight="400" xml:space="preserve">Measure the current </tspan></text>
<text font-family="Aptos, sans-serif" font-size="30.333" font-weight="400" text-anchor="start" x="111.62" xml:space="preserve" y="439.767"><tspan fill="#011842" font-family="Aptos, sans-serif" font-size="30.333" font-style="normal" font-weight="400" xml:space="preserve">completion rate and </tspan></text>
<text font-family="Aptos, sans-serif" font-size="30.333" font-weight="400" text-anchor="start" x="111.62" xml:space="preserve" y="476.773"><tspan fill="#011842" font-family="Aptos, sans-serif" font-size="30.333" font-style="normal" font-weight="400" xml:space="preserve">task time.</tspan></text></g></g>
<g><text aria-hidden="true" fill="#000000" font-family="Aptos, sans-serif" font-size="37" x="453.867" y="314.707">2.</text>
<g><text font-family="Aptos, sans-serif" font-size="37" font-weight="400" text-anchor="start" x="507.887" xml:space="preserve" y="314.707"><tspan fill="#000000" font-family="Aptos, sans-serif" font-size="37" font-style="normal" font-weight="400" xml:space="preserve">Run the pilot</tspan></text></g>
<g><text font-family="Aptos, sans-serif" font-size="30.333" font-weight="400" text-anchor="start" x="507.887" xml:space="preserve" y="357.62"><tspan fill="#011842" font-family="Aptos, sans-serif" font-size="30.333" font-style="normal" font-weight="400" xml:space="preserve">Test with two teams </tspan></text>
<text font-family="Aptos, sans-serif" font-size="30.333" font-weight="400" text-anchor="start" x="507.887" xml:space="preserve" y="394.627"><tspan fill="#011842" font-family="Aptos, sans-serif" font-size="30.333" font-style="normal" font-weight="400" xml:space="preserve">and review feedback </tspan></text>
<text font-family="Aptos, sans-serif" font-size="30.333" font-weight="400" text-anchor="start" x="507.887" xml:space="preserve" y="431.633"><tspan fill="#011842" font-family="Aptos, sans-serif" font-size="30.333" font-style="normal" font-weight="400" xml:space="preserve">each week.</tspan></text></g></g>
<g><text aria-hidden="true" fill="#000000" font-family="Aptos, sans-serif" font-size="37" x="850.133" y="314.707">3.</text>
<g><text font-family="Aptos, sans-serif" font-size="37" font-weight="400" text-anchor="start" x="904.153" xml:space="preserve" y="314.707"><tspan fill="#000000" font-family="Aptos, sans-serif" font-size="37" font-style="normal" font-weight="400" xml:space="preserve">Decide what to </tspan></text>
<text font-family="Aptos, sans-serif" font-size="37" font-weight="400" text-anchor="start" x="904.153" xml:space="preserve" y="359.847"><tspan fill="#000000" font-family="Aptos, sans-serif" font-size="37" font-style="normal" font-weight="400" xml:space="preserve">scale</tspan></text></g>
<g><text font-family="Aptos, sans-serif" font-size="30.333" font-weight="400" text-anchor="start" x="904.153" xml:space="preserve" y="402.76"><tspan fill="#011842" font-family="Aptos, sans-serif" font-size="30.333" font-style="normal" font-weight="400" xml:space="preserve">Compare outcomes </tspan></text>
<text font-family="Aptos, sans-serif" font-size="30.333" font-weight="400" text-anchor="start" x="904.153" xml:space="preserve" y="439.767"><tspan fill="#011842" font-family="Aptos, sans-serif" font-size="30.333" font-style="normal" font-weight="400" xml:space="preserve">with the baseline </tspan></text>
<text font-family="Aptos, sans-serif" font-size="30.333" font-weight="400" text-anchor="start" x="904.153" xml:space="preserve" y="476.773"><tspan fill="#011842" font-family="Aptos, sans-serif" font-size="30.333" font-style="normal" font-weight="400" xml:space="preserve">and agree the next </tspan></text>
<text font-family="Aptos, sans-serif" font-size="30.333" font-weight="400" text-anchor="start" x="904.153" xml:space="preserve" y="513.78"><tspan fill="#011842" font-family="Aptos, sans-serif" font-size="30.333" font-style="normal" font-weight="400" xml:space="preserve">step.</tspan></text></g></g>
<g/>
<g><g><g><text fill="#011842" font-family="Aptos, sans-serif" font-size="16" font-weight="400" style="white-space:pre" text-anchor="start" x="57.6" xml:space="preserve" y="687.68">Illustrative example • fictional data</text></g></g></g>
</svg>
