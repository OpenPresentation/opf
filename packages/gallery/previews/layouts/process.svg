<svg aria-label="Three steps from evidence to decision" aria-roledescription="slide" height="720" role="group" viewBox="0 0 1280 720" width="1280" xmlns="http://www.w3.org/2000/svg">
<rect aria-hidden="true" fill="#FFFFFF" height="720" opacity="1" width="1280" x="0" y="0"/>
<g><text fill="#000000" font-family="Aptos Display, sans-serif" font-size="54" font-weight="700" style="white-space:pre" text-anchor="start" x="57.6" xml:space="preserve" y="111.6">Three steps from evidence to decision</text></g>
<g><text fill="#000000" font-family="Aptos, sans-serif" font-size="28" font-weight="400" style="white-space:pre" text-anchor="start" x="57.6" xml:space="preserve" y="163.48">Illustrative example • fictional data</text></g>
<g><text aria-hidden="true" fill="#000000" font-family="Aptos, sans-serif" font-size="32" x="57.6" y="225.64">1.</text>
<g><text font-family="Aptos, sans-serif" font-size="32" font-weight="400" text-anchor="start" x="104.32" xml:space="preserve" y="225.64"><tspan fill="#000000" font-family="Aptos, sans-serif" font-size="32" font-style="normal" font-weight="400" xml:space="preserve">Establish a </tspan></text>
<text font-family="Aptos, sans-serif" font-size="32" font-weight="400" text-anchor="start" x="104.32" xml:space="preserve" y="264.68"><tspan fill="#000000" font-family="Aptos, sans-serif" font-size="32" font-style="normal" font-weight="400" xml:space="preserve">baseline</tspan></text></g>
<g><text font-family="Aptos, sans-serif" font-size="26.24" font-weight="400" text-anchor="start" x="104.32" xml:space="preserve" y="301.8"><tspan fill="#011842" font-family="Aptos, sans-serif" font-size="26.24" font-style="normal" font-weight="400" xml:space="preserve">Measure the current </tspan></text>
<text font-family="Aptos, sans-serif" font-size="26.24" font-weight="400" text-anchor="start" x="104.32" xml:space="preserve" y="333.813"><tspan fill="#011842" font-family="Aptos, sans-serif" font-size="26.24" font-style="normal" font-weight="400" xml:space="preserve">completion rate and task </tspan></text>
<text font-family="Aptos, sans-serif" font-size="26.24" font-weight="400" text-anchor="start" x="104.32" xml:space="preserve" y="365.826"><tspan fill="#011842" font-family="Aptos, sans-serif" font-size="26.24" font-style="normal" font-weight="400" xml:space="preserve">time.</tspan></text></g></g>
<g><text aria-hidden="true" fill="#000000" font-family="Aptos, sans-serif" font-size="32" x="453.867" y="225.64">2.</text>
<g><text font-family="Aptos, sans-serif" font-size="32" font-weight="400" text-anchor="start" x="500.587" xml:space="preserve" y="225.64"><tspan fill="#000000" font-family="Aptos, sans-serif" font-size="32" font-style="normal" font-weight="400" xml:space="preserve">Run the pilot</tspan></text></g>
<g><text font-family="Aptos, sans-serif" font-size="26.24" font-weight="400" text-anchor="start" x="500.587" xml:space="preserve" y="262.76"><tspan fill="#011842" font-family="Aptos, sans-serif" font-size="26.24" font-style="normal" font-weight="400" xml:space="preserve">Test with two teams and </tspan></text>
<text font-family="Aptos, sans-serif" font-size="26.24" font-weight="400" text-anchor="start" x="500.587" xml:space="preserve" y="294.773"><tspan fill="#011842" font-family="Aptos, sans-serif" font-size="26.24" font-style="normal" font-weight="400" xml:space="preserve">review feedback each </tspan></text>
<text font-family="Aptos, sans-serif" font-size="26.24" font-weight="400" text-anchor="start" x="500.587" xml:space="preserve" y="326.786"><tspan fill="#011842" font-family="Aptos, sans-serif" font-size="26.24" font-style="normal" font-weight="400" xml:space="preserve">week.</tspan></text></g></g>
<g><text aria-hidden="true" fill="#000000" font-family="Aptos, sans-serif" font-size="32" x="850.133" y="225.64">3.</text>
<g><text font-family="Aptos, sans-serif" font-size="32" font-weight="400" text-anchor="start" x="896.853" xml:space="preserve" y="225.64"><tspan fill="#000000" font-family="Aptos, sans-serif" font-size="32" font-style="normal" font-weight="400" xml:space="preserve">Decide what to </tspan></text>
<text font-family="Aptos, sans-serif" font-size="32" font-weight="400" text-anchor="start" x="896.853" xml:space="preserve" y="264.68"><tspan fill="#000000" font-family="Aptos, sans-serif" font-size="32" font-style="normal" font-weight="400" xml:space="preserve">scale</tspan></text></g>
<g><text font-family="Aptos, sans-serif" font-size="26.24" font-weight="400" text-anchor="start" x="896.853" xml:space="preserve" y="301.8"><tspan fill="#011842" font-family="Aptos, sans-serif" font-size="26.24" font-style="normal" font-weight="400" xml:space="preserve">Compare outcomes with </tspan></text>
<text font-family="Aptos, sans-serif" font-size="26.24" font-weight="400" text-anchor="start" x="896.853" xml:space="preserve" y="333.813"><tspan fill="#011842" font-family="Aptos, sans-serif" font-size="26.24" font-style="normal" font-weight="400" xml:space="preserve">the baseline and agree </tspan></text>
<text font-family="Aptos, sans-serif" font-size="26.24" font-weight="400" text-anchor="start" x="896.853" xml:space="preserve" y="365.826"><tspan fill="#011842" font-family="Aptos, sans-serif" font-size="26.24" font-style="normal" font-weight="400" xml:space="preserve">the next step.</tspan></text></g></g>
</svg>
