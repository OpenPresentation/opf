<g><text fill="#000000" font-family="Aptos Display, sans-serif" font-size="54" font-weight="700" style="white-space:pre" text-anchor="start" x="57.6" xml:space="preserve" y="111.6">Scope, evidence and the next decision</text></g>
<rect aria-hidden="true" fill="#F0F0F0" height="127.85" rx="8" stroke="#CCCCCC" width="1164.8" x="57.6" y="187.805"/><g><text fill="#000000" font-family="Aptos, sans-serif" font-size="37" font-weight="400" style="white-space:pre" text-anchor="start" x="69.6" xml:space="preserve" y="243.59">Test with two teams for six weeks. Measure task completion </text>
<text fill="#000000" font-family="Aptos, sans-serif" font-size="37" font-weight="400" style="white-space:pre" text-anchor="start" x="69.6" xml:space="preserve" y="288.73">and time before deciding what to scale.</text></g>
<rect aria-hidden="true" fill="#F0F0F0" height="127.85" rx="8" stroke="#CCCCCC" width="1164.8" x="57.6" y="339.655"/><g><text fill="#000000" font-family="Aptos, sans-serif" font-size="37" font-weight="400" style="white-space:pre" text-anchor="start" x="69.6" xml:space="preserve" y="395.44">Keep the scope narrow, collect feedback weekly and give each </text>
<text fill="#000000" font-family="Aptos, sans-serif" font-size="37" font-weight="400" style="white-space:pre" text-anchor="start" x="69.6" xml:space="preserve" y="440.58">decision a named owner.</text></g>
<rect aria-hidden="true" fill="#F0F0F0" height="127.85" rx="8" stroke="#CCCCCC" width="1164.8" x="57.6" y="491.505"/><g><text fill="#000000" font-family="Aptos, sans-serif" font-size="37" font-weight="400" style="white-space:pre" text-anchor="start" x="69.6" xml:space="preserve" y="547.29">Compare the results with the baseline. Expand only when the </text>
<text fill="#000000" font-family="Aptos, sans-serif" font-size="37" font-weight="400" style="white-space:pre" text-anchor="start" x="69.6" xml:space="preserve" y="592.43">evidence supports the next step.</text></g>
<g/>
