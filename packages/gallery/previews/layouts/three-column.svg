<g><text fill="#000000" font-family="Aptos Display, sans-serif" font-size="54" font-weight="700" style="white-space:pre" text-anchor="start" x="57.6" xml:space="preserve" y="111.6">Scope, evidence and the next decision</text></g>
<rect aria-hidden="true" fill="#F0F0F0" height="154.733333" rx="8" stroke="#CCCCCC" width="1164.8" x="57.6" y="147.48"/><g><text fill="#000000" font-family="Aptos, sans-serif" font-size="28" font-weight="400" style="white-space:pre" text-anchor="start" x="69.6" xml:space="preserve" y="218.687">Test with two teams for six weeks. Measure task completion and time before </text>
<text fill="#000000" font-family="Aptos, sans-serif" font-size="28" font-weight="400" style="white-space:pre" text-anchor="start" x="69.6" xml:space="preserve" y="252.847">deciding what to scale.</text></g>
<rect aria-hidden="true" fill="#F0F0F0" height="154.733333" rx="8" stroke="#CCCCCC" width="1164.8" x="57.6" y="326.213333"/><g><text fill="#000000" font-family="Aptos, sans-serif" font-size="28" font-weight="400" style="white-space:pre" text-anchor="start" x="69.6" xml:space="preserve" y="397.42">Keep the scope narrow, collect feedback weekly and give each decision a named </text>
<text fill="#000000" font-family="Aptos, sans-serif" font-size="28" font-weight="400" style="white-space:pre" text-anchor="start" x="69.6" xml:space="preserve" y="431.58">owner.</text></g>
<rect aria-hidden="true" fill="#F0F0F0" height="154.733333" rx="8" stroke="#CCCCCC" width="1164.8" x="57.6" y="504.946667"/><g><text fill="#000000" font-family="Aptos, sans-serif" font-size="28" font-weight="400" style="white-space:pre" text-anchor="start" x="69.6" xml:space="preserve" y="576.153">Compare the results with the baseline. Expand only when the evidence supports </text>
<text fill="#000000" font-family="Aptos, sans-serif" font-size="28" font-weight="400" style="white-space:pre" text-anchor="start" x="69.6" xml:space="preserve" y="610.313">the next step.</text></g>
<g/>
