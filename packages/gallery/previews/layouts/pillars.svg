<g><text fill="#000000" font-family="Aptos Display, sans-serif" font-size="54" font-weight="700" style="white-space:pre" text-anchor="start" x="57.6" xml:space="preserve" y="111.6">Three conditions for a useful pilot</text></g>
<g><text fill="#000000" font-family="Aptos, sans-serif" font-size="28" font-weight="400" style="white-space:pre" text-anchor="start" x="57.6" xml:space="preserve" y="163.48">Illustrative example • fictional data</text></g>
<g><g><text font-family="Aptos, sans-serif" font-size="32" font-weight="400" text-anchor="start" x="57.6" xml:space="preserve" y="225.64"><tspan fill="#000000" font-family="Aptos, sans-serif" font-size="32" font-style="normal" font-weight="400" xml:space="preserve">Clear scope</tspan></text></g>
<g><text font-family="Aptos, sans-serif" font-size="26.24" font-weight="400" text-anchor="start" x="57.6" xml:space="preserve" y="262.76"><tspan fill="#011842" font-family="Aptos, sans-serif" font-size="26.24" font-style="normal" font-weight="400" xml:space="preserve">Two teams and one workflow </tspan></text>
<text font-family="Aptos, sans-serif" font-size="26.24" font-weight="400" text-anchor="start" x="57.6" xml:space="preserve" y="294.773"><tspan fill="#011842" font-family="Aptos, sans-serif" font-size="26.24" font-style="normal" font-weight="400" xml:space="preserve">keep the pilot focused.</tspan></text></g></g>
<g><g><text font-family="Aptos, sans-serif" font-size="32" font-weight="400" text-anchor="start" x="453.867" xml:space="preserve" y="225.64"><tspan fill="#000000" font-family="Aptos, sans-serif" font-size="32" font-style="normal" font-weight="400" xml:space="preserve">Consistent measures</tspan></text></g>
<g><text font-family="Aptos, sans-serif" font-size="26.24" font-weight="400" text-anchor="start" x="453.867" xml:space="preserve" y="262.76"><tspan fill="#011842" font-family="Aptos, sans-serif" font-size="26.24" font-style="normal" font-weight="400" xml:space="preserve">Track completion and task </tspan></text>
<text font-family="Aptos, sans-serif" font-size="26.24" font-weight="400" text-anchor="start" x="453.867" xml:space="preserve" y="294.773"><tspan fill="#011842" font-family="Aptos, sans-serif" font-size="26.24" font-style="normal" font-weight="400" xml:space="preserve">time against a baseline.</tspan></text></g></g>
<g><g><text font-family="Aptos, sans-serif" font-size="32" font-weight="400" text-anchor="start" x="850.133" xml:space="preserve" y="225.64"><tspan fill="#000000" font-family="Aptos, sans-serif" font-size="32" font-style="normal" font-weight="400" xml:space="preserve">An explicit decision</tspan></text></g>
<g><text font-family="Aptos, sans-serif" font-size="26.24" font-weight="400" text-anchor="start" x="850.133" xml:space="preserve" y="262.76"><tspan fill="#011842" font-family="Aptos, sans-serif" font-size="26.24" font-style="normal" font-weight="400" xml:space="preserve">Agree the evidence needed </tspan></text>
<text font-family="Aptos, sans-serif" font-size="26.24" font-weight="400" text-anchor="start" x="850.133" xml:space="preserve" y="294.773"><tspan fill="#011842" font-family="Aptos, sans-serif" font-size="26.24" font-style="normal" font-weight="400" xml:space="preserve">before expanding.</tspan></text></g></g>
