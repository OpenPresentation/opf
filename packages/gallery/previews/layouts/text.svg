<text fill="#000000" font-family="Aptos, sans-serif" font-size="37" font-weight="400" style="white-space:pre" text-anchor="start" x="453.867" xml:space="preserve" y="481.22">a named owner.</text></g>
<g><text fill="#000000" font-family="Aptos, sans-serif" font-size="37" font-weight="400" style="white-space:pre" text-anchor="start" x="850.133" xml:space="preserve" y="300.66">Compare the results </text>
