<text fill="#000000" font-family="Aptos, sans-serif" font-size="37" font-weight="400" style="white-space:pre" text-anchor="start" x="57.6" xml:space="preserve" y="526.36">what to scale.</text></g>
<g><text fill="#000000" font-family="Aptos, sans-serif" font-size="37" font-weight="400" style="white-space:pre" text-anchor="start" x="453.867" xml:space="preserve" y="300.66">Keep the scope </text>
