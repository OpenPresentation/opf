<text font-family="Aptos, sans-serif" font-size="37" font-weight="400" text-anchor="start" x="57.6" xml:space="preserve" y="361.24"><tspan fill="#000000" font-family="Aptos, sans-serif" font-size="37" font-style="normal" font-weight="400" xml:space="preserve">setup cost and a clear </tspan></text>
<text font-family="Aptos, sans-serif" font-size="37" font-weight="400" text-anchor="start" x="57.6" xml:space="preserve" y="406.38"><tspan fill="#000000" font-family="Aptos, sans-serif" font-size="37" font-style="normal" font-weight="400" xml:space="preserve">baseline.</tspan></text></g>
<g><text font-family="Aptos, sans-serif" font-size="37" font-weight="700" text-anchor="start" x="652" xml:space="preserve" y="270.96"><tspan fill="#000000" font-family="Aptos, sans-serif" font-size="37" font-style="normal" font-weight="700" xml:space="preserve">Option B: broad rollout</tspan></text>
<text font-family="Aptos, sans-serif" font-size="37" font-weight="400" text-anchor="start" x="652" xml:space="preserve" y="316.1"><tspan fill="#000000" font-family="Aptos, sans-serif" font-size="37" font-style="normal" font-weight="400" xml:space="preserve">All teams, three months. </tspan></text>
<text font-family="Aptos, sans-serif" font-size="37" font-weight="400" text-anchor="start" x="652" xml:space="preserve" y="361.24"><tspan fill="#000000" font-family="Aptos, sans-serif" font-size="37" font-style="normal" font-weight="400" xml:space="preserve">Wider reach with greater </tspan></text>
<text font-family="Aptos, sans-serif" font-size="37" font-weight="400" text-anchor="start" x="652" xml:space="preserve" y="406.38"><tspan fill="#000000" font-family="Aptos, sans-serif" font-size="37" font-style="normal" font-weight="400" xml:space="preserve">coordination needs.</tspan></text></g>
<rect aria-hidden="true" fill="#011842" height="134.68" rx="8" width="1164.8" x="57.6" y="525"/><g><text font-family="Aptos, sans-serif" font-size="37" font-weight="700" text-anchor="start" x="81.6" xml:space="preserve" y="584.2"><tspan fill="#FFFFFF" font-family="Aptos, sans-serif" font-size="37" font-style="normal" font-weight="700" xml:space="preserve">Recommendation:</tspan><tspan fill="#FFFFFF" font-family="Aptos, sans-serif" font-size="37" font-style="normal" font-weight="400" xml:space="preserve"> establish the evidence with Option A </tspan></text>
<text font-family="Aptos, sans-serif" font-size="37" font-weight="400" text-anchor="start" x="81.6" xml:space="preserve" y="629.34"><tspan fill="#FFFFFF" font-family="Aptos, sans-serif" font-size="37" font-style="normal" font-weight="400" xml:space="preserve">before committing to Option B.</tspan></text></g>
<g/>
