<g><text font-family="Aptos, sans-serif" font-size="37" font-weight="700" text-anchor="start" x="57.6" xml:space="preserve" y="270.96"><tspan fill="#000000" font-family="Aptos, sans-serif" font-size="37" font-style="normal" font-weight="700" xml:space="preserve">Option A: focused pilot</tspan></text>
