<text fill="#FFFFFF" font-family="Roboto Mono, monospace" font-size="22" font-weight="400" style="white-space:pre" text-anchor="start" text-rendering="geometricPrecision" x="75.6" xml:space="preserve" y="245.84"><tspan x="75.6">item.value, </tspan><tspan fill="#FCD34D">0</tspan><tspan>);</tspan></text>
<text fill="#FFFFFF" font-family="Roboto Mono, monospace" font-size="22" font-weight="400" style="white-space:pre" text-anchor="start" text-rendering="geometricPrecision" x="75.6" xml:space="preserve" y="272.68"><tspan x="75.6">console.</tspan><tspan fill="#93C5FD">log</tspan><tspan>(total);</tspan></text></g></g>
