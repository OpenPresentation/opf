<svg aria-label="Keep the implementation easy to inspect" aria-roledescription="slide" height="720" role="group" viewBox="0 0 1280 720" width="1280" xmlns="http://www.w3.org/2000/svg">
<rect aria-hidden="true" fill="#FFFFFF" height="720" opacity="1" width="1280" x="0" y="0"/>
<g><text fill="#000000" font-family="Aptos Display, sans-serif" font-size="54" font-weight="700" style="white-space:pre" text-anchor="start" x="57.6" xml:space="preserve" y="111.6">Keep the implementation easy to inspect</text></g>
<g><text fill="#000000" font-family="Aptos, sans-serif" font-size="28" font-weight="400" style="white-space:pre" text-anchor="start" x="57.6" xml:space="preserve" y="163.48">Illustrative example • fictional data</text></g>
<g><rect aria-hidden="true" fill="#000000" height="111.44" stroke="#CCCCCC" stroke-width="1" width="684.48" x="57.6" y="193.64"/>
<g><text fill="#2B7DB2" font-family="Roboto Mono, monospace" font-size="16" font-weight="700" style="white-space:pre" text-anchor="start" text-rendering="geometricPrecision" x="75.6" xml:space="preserve" y="227.64"><tspan x="75.6">javascript</tspan></text></g>
<g><text fill="#FFFFFF" font-family="Roboto Mono, monospace" font-size="18" font-weight="400" style="white-space:pre" text-anchor="start" text-rendering="geometricPrecision" x="75.6" xml:space="preserve" y="261.16"><tspan fill="#2B7DB2" x="75.6">const</tspan><tspan> total = items.</tspan><tspan fill="#93C5FD">reduce</tspan><tspan>((sum, item) =&gt; sum + item.value, </tspan><tspan fill="#FCD34D">0</tspan><tspan>);</tspan></text>
<text fill="#FFFFFF" font-family="Roboto Mono, monospace" font-size="18" font-weight="400" style="white-space:pre" text-anchor="start" text-rendering="geometricPrecision" x="75.6" xml:space="preserve" y="283.12"><tspan x="75.6">console.</tspan><tspan fill="#93C5FD">log</tspan><tspan>(total);</tspan></text></g></g>
<g><text fill="#000000" font-family="Aptos, sans-serif" font-size="28" font-weight="400" style="white-space:pre" text-anchor="start" x="766.08" xml:space="preserve" y="221.64">The reducer adds each item’s </text>
<text fill="#000000" font-family="Aptos, sans-serif" font-size="28" font-weight="400" style="white-space:pre" text-anchor="start" x="766.08" xml:space="preserve" y="255.8">value to a running sum. Starting </text>
<text fill="#000000" font-family="Aptos, sans-serif" font-size="28" font-weight="400" style="white-space:pre" text-anchor="start" x="766.08" xml:space="preserve" y="289.96">at zero also makes an empty list </text>
<text fill="#000000" font-family="Aptos, sans-serif" font-size="28" font-weight="400" style="white-space:pre" text-anchor="start" x="766.08" xml:space="preserve" y="324.12">return zero.</text></g>
</svg>
