<svg aria-label="Keep the implementation easy to inspect" aria-roledescription="slide" height="720" role="group" viewBox="0 0 1280 720" width="1280" xmlns="http://www.w3.org/2000/svg">
<rect aria-hidden="true" fill="#FFFFFF" height="720" opacity="1" width="1280" x="0" y="0"/>
<g><text fill="#000000" font-family="Aptos Display, sans-serif" font-size="54" font-weight="700" style="white-space:pre" text-anchor="start" x="57.6" xml:space="preserve" y="111.6">Keep the implementation easy to inspect</text></g>
<g><text fill="#000000" font-family="Aptos, sans-serif" font-size="25" font-weight="400" style="white-space:pre" text-anchor="start" x="57.6" xml:space="preserve" y="160.48">Illustrative example • fictional data</text></g>
<g><rect aria-hidden="true" fill="#111827" height="472.42" stroke="#334155" stroke-width="1" width="684.48" x="57.6" y="189.98"/>
<g><text fill="#93C5FD" font-family="Roboto Mono, monospace" font-size="16" font-weight="700" style="white-space:pre" text-anchor="start" text-rendering="geometricPrecision" x="75.6" xml:space="preserve" y="223.98"><tspan x="75.6">javascript</tspan></text></g>
<g><text fill="#E5E7EB" font-family="Roboto Mono, monospace" font-size="18" font-weight="400" style="white-space:pre" text-anchor="start" text-rendering="geometricPrecision" x="75.6" xml:space="preserve" y="257.5"><tspan fill="#2F88C3" x="75.6">const</tspan><tspan> total = items.</tspan><tspan fill="#93C5FD">reduce</tspan><tspan>((sum, item) =&gt; sum + item.value, </tspan><tspan fill="#FCD34D">0</tspan><tspan>);</tspan></text>
<text fill="#E5E7EB" font-family="Roboto Mono, monospace" font-size="18" font-weight="400" style="white-space:pre" text-anchor="start" text-rendering="geometricPrecision" x="75.6" xml:space="preserve" y="279.46"><tspan x="75.6">console.</tspan><tspan fill="#93C5FD">log</tspan><tspan>(total);</tspan></text></g></g>
<g><text fill="#000000" font-family="Aptos, sans-serif" font-size="25" font-weight="400" style="white-space:pre" text-anchor="start" x="766.08" xml:space="preserve" y="214.98">The reducer adds each item’s value </text>
<text fill="#000000" font-family="Aptos, sans-serif" font-size="25" font-weight="400" style="white-space:pre" text-anchor="start" x="766.08" xml:space="preserve" y="245.48">to a running sum. Starting at zero </text>
<text fill="#000000" font-family="Aptos, sans-serif" font-size="25" font-weight="400" style="white-space:pre" text-anchor="start" x="766.08" xml:space="preserve" y="275.98">also makes an empty list return </text>
<text fill="#000000" font-family="Aptos, sans-serif" font-size="25" font-weight="400" style="white-space:pre" text-anchor="start" x="766.08" xml:space="preserve" y="306.48">zero.</text></g>
</svg>
