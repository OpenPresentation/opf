name: Regenerate candidate goldens
on:
  workflow_dispatch:
    inputs:
      renderer-branch:
        description: Same-repository candidate branch to receive reviewed baseline commit (never main)
        required: true
        type: string
      renderer-ref:
        description: Exact candidate renderer commit SHA on renderer-branch
        required: true
        type: string
      core-ref:
        description: Exact candidate core commit SHA
        required: true
        type: string
      gallery-ref:
        description: Exact candidate gallery3 commit SHA
        required: true
        type: string
      baseline-name:
        description: New renderer example baseline suffix (never cover-centering)
        required: true
        type: string
      selection:
        type: choice
        options: [examples, templates, both]
        default: examples
      dry-run:
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: candidate-goldens-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    timeout-minutes: 45
    env:
      OPF_PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      RENDERER: ${{ inputs.renderer-ref }}
      BRANCH: ${{ inputs.renderer-branch }}
      CORE: ${{ inputs.core-ref }}
      GALLERY: ${{ inputs.gallery-ref }}
      NAME: ${{ inputs.baseline-name }}
      SELECTION: ${{ inputs.selection }}
    steps:
      - name: Refuse default branch
        env:
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: test "$GITHUB_REF_NAME" != "$DEFAULT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tools
          persist-credentials: false
      - name: Validate immutable graph before checkout
        working-directory: tools
        run: node scripts/candidate-goldens.mjs plan --branch "$BRANCH" --head "$RENDERER" --core "$CORE" --gallery "$GALLERY" --name "$NAME" --selection "$SELECTION"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.renderer-ref }}
          path: opf-render
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: guard/opf-render
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf
          ref: main
          path: guard/opf
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf
          ref: ${{ inputs.core-ref }}
          path: opf
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/gallery
          ref: ${{ inputs.gallery-ref }}
          path: gallery-candidate
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Confirm candidate branch still names selected commit
        working-directory: opf-render
        run: |
          tip="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          test "$tip" = "$RENDERER"
      - name: Reproduce unchanged main in isolated dependency trees
        run: |
          pnpm --dir guard/opf install --frozen-lockfile
          npm ci --prefix guard/opf-render
          pnpm --dir guard/opf build
          npm run build --prefix guard/opf-render
          rm -rf guard/opf-render/node_modules/@openpresentation/opf
          ln -s "$GITHUB_WORKSPACE/guard/opf/packages/javascript" guard/opf-render/node_modules/@openpresentation/opf
          (cd guard/opf-render && node scripts/golden-pinned-image.mjs && node test/golden.mjs --update)
          node tools/scripts/candidate-goldens.mjs guard --candidate guard/opf-render/artifacts/golden/candidate.json --baseline guard/opf-render/test/golden/opf-examples-png.rr81-v2-reviewed --core "$CORE" --gallery "$GALLERY" --name "$NAME" --selection "$SELECTION"
          git -C guard/opf rev-parse HEAD > guard/core-sha.txt
          git -C guard/opf-render rev-parse HEAD > guard/renderer-sha.txt
      - name: Install, link and build candidate only
        run: |
          pnpm --dir opf install --frozen-lockfile
          npm ci --prefix opf-render
          npm ci --prefix gallery-candidate
          npm run build --prefix gallery-candidate
          node tools/scripts/candidate-goldens.mjs link --workspace "$GITHUB_WORKSPACE" --core "$CORE" --gallery "$GALLERY" --name "$NAME" --selection "$SELECTION"
          (cd opf && node scripts/materialize-gallery-catalog.mjs)
          pnpm --dir opf build
          npm run build --prefix opf-render
          (cd opf-render && node scripts/golden-pinned-image.mjs)
      - name: Generate fixed 807 examples and reviewed 495 template cases
        working-directory: opf-render
        run: |
          if [ "$SELECTION" != templates ]; then OPF_GOLDEN_BASELINE=test/golden/opf-examples-png.rr81-v2-reviewed OPF_GOLDEN_ARTIFACTS=changed node test/golden.mjs --update; fi
          if [ "$SELECTION" != examples ]; then node test/layout-template-goldens.mjs --update; fi
          node "$GITHUB_WORKSPACE/tools/scripts/candidate-goldens.mjs" verify --workspace "$GITHUB_WORKSPACE" --root "$PWD" --core "$CORE" --gallery "$GALLERY" --name "$NAME" --selection "$SELECTION"
          cp "$GITHUB_WORKSPACE/guard/core-sha.txt" artifacts/guard-core-sha.txt
          cp "$GITHUB_WORKSPACE/guard/renderer-sha.txt" artifacts/guard-renderer-sha.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: candidate-goldens
          path: opf-render/artifacts/
          retention-days: 14
  push:
    needs: render
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CORE: ${{ inputs.core-ref }}
      GALLERY: ${{ inputs.gallery-ref }}
      NAME: ${{ inputs.baseline-name }}
      SELECTION: ${{ inputs.selection }}
      HEAD: ${{ inputs.renderer-ref }}
      BRANCH: ${{ inputs.renderer-branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.renderer-ref }}
          path: opf-render
          persist-credentials: false
      # Source data only: the trusted tools helper recomputes digests without running candidate code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf
          ref: ${{ inputs.core-ref }}
          path: opf
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/gallery
          ref: ${{ inputs.gallery-ref }}
          path: gallery-candidate
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-goldens
          path: ${{ runner.temp }}/candidate-goldens
      - name: Verify head, apply only baseline artifacts and push without force
        working-directory: opf-render
        env:
          TOKEN: ${{ github.token }}
          ARTIFACT: ${{ runner.temp }}/candidate-goldens
        run: |
          tip="$(git ls-remote "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" "refs/heads/$BRANCH" | cut -f1)"
          test "$tip" = "$HEAD"
          node "$GITHUB_WORKSPACE/tools/scripts/candidate-goldens.mjs" apply --workspace "$GITHUB_WORKSPACE" --root "$PWD" --head "$HEAD" --artifact "$ARTIFACT" --core "$CORE" --gallery "$GALLERY" --name "$NAME" --selection "$SELECTION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- test/golden
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Regenerate candidate goldens ($GITHUB_RUN_ID)" -m "Renderer $HEAD; core $CORE; gallery $GALLERY. Pinned run evidence: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git push "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$BRANCH"
