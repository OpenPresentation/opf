name: Publish @openpresentation/opf-render
on:
  push:
    tags: ["opf-render-v*", "@openpresentation/opf-render@v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  npm:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@11.16.0
      - run: npm ci
      - run: npm audit
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          case "${GITHUB_REF_NAME}" in
            "opf-render-v${VERSION}"|"@openpresentation/opf-render@v${VERSION}") ;;
            *) echo "Release tag does not match package version ${VERSION}."; exit 1 ;;
          esac
      - run: npm run typecheck
      - run: npm run validate
      - run: npm test
      - run: npm run test:code
      - name: Refuse a declared unreleased core (RR-55)
        run: node scripts/published-core-gate.mjs --forbid
      - run: npm run test:packed
      - name: Verify Playwright image version
        run: node -e "if (require('playwright/package.json').version !== '1.63.0') throw new Error('Update the pinned Playwright image with the test package.');"
      - run: npm run test:browser
      - run: npm run test:code-browser
      - run: npm pack --dry-run
      - run: npm publish --access public --provenance

  # RR-20: every npm publish creates its GitHub Release (from 0.18 on), notes taken from the version's CHANGELOG.md section.
  # Separate job: only it holds contents: write; the publish job keeps id-token: write for provenance and contents: read.
  release:
    name: Create GitHub Release
    needs: npm
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="$(echo "${GITHUB_REF_NAME}" | sed -E 's/^(opf-render-v|@openpresentation\/opf-render@v)//')"
          NOTES_FILE="$(mktemp)"

          # The section under "## VERSION" or "## VERSION (date)", without its blank edges.
          awk -v ver="## ${VERSION}" '
            $0 == ver || index($0, ver " ") == 1 { found = 1; next }
            /^## / { if (found) exit }
            found { lines[++n] = $0 }
            END {
              s = 1; while (s <= n && lines[s] ~ /^[[:space:]]*$/) s++
              e = n; while (e >= s && lines[e] ~ /^[[:space:]]*$/) e--
              for (i = s; i <= e; i++) print lines[i]
            }
          ' CHANGELOG.md > "${NOTES_FILE}"

          if [ ! -s "${NOTES_FILE}" ]; then
            echo "CHANGELOG.md has no '## ${VERSION}' section (or it is empty); add it before publishing." >&2
            exit 1
          fi

          echo "NOTES_FILE=${NOTES_FILE}" >> "${GITHUB_ENV}"
          echo "RELEASE_VERSION=${VERSION}" >> "${GITHUB_ENV}"
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --json tagName >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; preserving its notes."
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "@openpresentation/opf-render ${RELEASE_VERSION}" \
              --notes-file "${NOTES_FILE}" \
              --verify-tag \
              --latest
          fi
