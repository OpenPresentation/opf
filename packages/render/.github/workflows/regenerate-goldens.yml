# RR-52: regenerate the renderer golden hashes for a pull request, inside the same pinned Playwright image CI uses.
#
# Start it by adding the `regenerate-goldens` label to a pull request from a branch of this repository, or by running
# the workflow on that branch (workflow_dispatch). It:
#   1. refuses to run anywhere but the pinned image (scripts/golden-pinned-image.mjs),
#   2. rebuilds the coordinated source graph ci.yml tests (core's ecosystem.lock.json, read by scripts/ecosystem-pins.mjs),
#   3. renders the corpus, rewrites only the per-deck files whose hashes differ (scripts/golden-promote.mjs) and never
#      changes the comparison (exact hashes at the baseline's scale; the 0.1 px and 0.15 px metric gates are untouched),
#   4. uploads artifacts/golden (diff.json, the review sheets of the changed slides, the changed PNGs) as an artifact,
#   5. pushes one commit that touches only the selected baseline directory, then dispatches ci.yml on the branch.
# Review stays human: the commit is evidence to review, not an approval. Open the artifact, look at the changed slides,
# and only then approve the pull request. See test/golden/README.md.
name: regenerate-goldens
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regenerate-goldens-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  regenerate:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.label.name == 'regenerate-goldens' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    # The same digest ci.yml pins (test/golden-pinned-image.mjs fails when the two differ).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      # The container.image expression cannot read env, and the job context has no image, so the literal is repeated
      # here; the guard compares it with ci.yml's pin and test/golden-pinned-image.mjs compares all three.
      OPF_PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Never regenerate on the default branch
        shell: bash
        run: |
          if [ "$BRANCH" = "${{ github.event.repository.default_branch }}" ]; then
            echo "Goldens are regenerated on a pull request branch, never on the default branch." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BRANCH }}
          persist-credentials: false
          path: opf-render
      # Fail fast, before any install: wrong runner, wrong image, wrong OS.
      - name: Refuse anything but the pinned Playwright image
        run: node opf-render/scripts/golden-pinned-image.mjs
      # RR-50: the sibling commits come from core's ecosystem.lock.json (the same action ci.yml runs), the golden
      # selection from ci.yml's golden-override or the lock; the output names stay (scripts/ecosystem-pins.mjs).
      - name: Read core's ecosystem.lock.json
        id: refs
        uses: OpenPresentation/opf/.github/actions/ecosystem-refs@main
        with:
          consumer: opf-render
      - name: Read the pins (lock) and the golden selection (ci.yml)
        id: pins
        env:
          LOCK_FILE: ${{ steps.refs.outputs.lock_file }}
        run: node opf-render/scripts/ecosystem-pins.mjs --lock "$LOCK_FILE" --github-output --require-renderer-baseline
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf
          ref: ${{ steps.refs.outputs.opf }}
          path: opf
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf-pptx
          ref: ${{ steps.refs.outputs.opf_pptx }}
          path: opf-pptx
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf-editor
          ref: ${{ steps.refs.outputs.opf_editor }}
          path: opf-editor
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: opf-render/package-lock.json
      - name: Install locked coordinated dependencies
        shell: bash
        working-directory: .
        run: |
          pnpm --dir opf install --frozen-lockfile
          for repo in opf-render opf-pptx opf-editor; do
            npm ci --prefix "$repo"
          done
      - name: Build and link coordinated sources
        working-directory: opf
        run: |
          pnpm build
          node scripts/link-ecosystem.mjs --packages-only
      - name: Pinned image and installed Playwright agree
        working-directory: opf-render
        run: node scripts/golden-pinned-image.mjs
      - name: Build the renderer
        working-directory: opf-render
        run: npm run build
      - name: Render the corpus and rewrite the decks that differ
        working-directory: opf-render
        env:
          OPF_GOLDEN_BASELINE: ${{ github.workspace }}/${{ steps.pins.outputs.baseline }}
          OPF_GOLDEN_ARTIFACTS: changed
        run: |
          node test/golden.mjs --update
          node scripts/golden-promote.mjs | tee artifacts/golden/promote.txt
          {
            echo "### regenerate-goldens"
            echo
            cat artifacts/golden/promote.txt
            echo
            echo 'Changed decks:'
            node -e "for (const d of require('./artifacts/golden/diff.json').changedDecks) console.log('- ' + d)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diff.json and the review sheets
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regenerated-goldens
          path: |
            opf-render/artifacts/golden/diff.json
            opf-render/artifacts/golden/promote.txt
            opf-render/artifacts/golden/index.html
            opf-render/artifacts/golden/sheet-*.png
            opf-render/artifacts/golden/[0-9]*.png
          retention-days: 14
          if-no-files-found: warn
      - name: Push one commit to the branch
        id: push
        working-directory: opf-render
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          baseline="${{ steps.pins.outputs.baseline_directory }}"
          echo "baseline directory: $baseline"
          if [ -z "$(git status --porcelain -- "$baseline")" ]; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "No deck differs from the selected baseline; nothing to push."
            exit 0
          fi
          # The commit may only touch the selected baseline directory.
          outside="$(git status --porcelain | grep -v " $baseline/" || true)"
          if [ -n "$outside" ]; then echo "Unexpected changes outside $baseline:" >&2; echo "$outside" >&2; exit 1; fi
          decks="$(node -e "console.log(require('./artifacts/golden/diff.json').changedDecks.length)")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$baseline"
          git commit -q -m "Regenerate goldens: $decks decks (regenerate-goldens run $GITHUB_RUN_ID)" \
            -m "Generated in $OPF_PLAYWRIGHT_IMAGE. Evidence (diff.json and the review sheets) is attached to the run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. A human reviews the changed slides before approving."
          git push "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Run CI on the new commit, release the label, leave the run link
        if: ${{ steps.push.outputs.pushed == 'true' }}
        working-directory: opf-render
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/golden-ci-notify.mjs dispatch-ci "$BRANCH"
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            node scripts/golden-ci-notify.mjs unlabel "${{ github.event.pull_request.number }}" regenerate-goldens
            node scripts/golden-ci-notify.mjs comment "${{ github.event.pull_request.number }}" "regenerate-goldens pushed one commit that rewrites only the decks that moved. Review diff.json and the sheets in the run artifacts before approving: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. CI was dispatched on the new commit."
          fi
