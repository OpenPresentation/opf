name: CI
# RR-57 (CI diet): a pull request runs the Linux `package` job on the current Node (no Node 22 or 26 legs).
# The Node 22 and Node 26 engines-range legs run on push to main, the weekly schedule, workflow_dispatch and the merge
# queue, and on a pull request that carries the label `full-ci` (add it when a change touches Node-version-specific
# code). The `labeled` event starts them without a new push; any other label starts nothing and, being in its own
# concurrency group, cancels nothing.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # RR-48: ready for the merge queue (a no-op until the owner enables it, opf#297). A queue run has no
  # pull_request payload, so the concurrency group falls back to its own gh-readonly-queue ref, and a
  # queue run is never cancelled by a newer push.
  merge_group:
  push:
    branches: [main]
  schedule:
    # Weekly full run (every leg) on an unchanged main, to notice runner image, registry and dependency drift.
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' && '-ignored' || github.event_name == 'schedule' && '-schedule' || '' }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' && github.event_name != 'schedule' }}
jobs:
  package:
    # An unrelated label starts nothing.
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'full-ci' }}
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    timeout-minutes: 35
    defaults:
      run:
        working-directory: opf-render
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          path: opf-render
      # RR-47: an expired or malformed test/quarantine.json entry fails CI. See test/QUARANTINE.md.
      - name: Check the test quarantine
        run: node --test scripts/quarantine.test.mjs && node scripts/quarantine.mjs check
      # RR-46: a reminder, never a failure: src/ changed without a changelog fragment (changes/README.md).
      - name: Changelog fragment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: node scripts/changelog-fragments.mjs warn-missing --base origin/${{ github.base_ref }}
      # RR-50: no hand pins. The commits of opf, opf-pptx and opf-editor and the golden baseline (OPF_GOLDEN_BASELINE, exported
      # to the later steps) come from core's ecosystem.lock.json, written by the roller. A `Depends-On:` trailer in the pull
      # request body tests an unmerged pull request of another repository instead (core docs/ecosystem-development.md).
      - name: Resolve the coordinated commits from core's ecosystem.lock.json
        id: refs
        uses: OpenPresentation/opf/.github/actions/ecosystem-refs@main
        with:
          consumer: opf-render
          export-golden: 'true'
          # A renderer pull request that moves pixels selects its own baseline directory here, e.g.
          # opf-render/test/golden/<name> (regenerate-goldens writes into it; scripts/ecosystem-pins.mjs reads it).
          # Empty selects the lock's golden. The roller makes a non-empty value the lock's golden, so set it only for a
          # baseline that records core main's examples: core's registry run selects a reviewed core golden (or a retained
          # one, scripts/registry-golden.mjs) only while the lock's golden lives in core.
          golden-override: ''
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf
          ref: ${{ steps.refs.outputs.opf }}
          path: opf
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf-pptx
          ref: ${{ steps.refs.outputs.opf_pptx }}
          path: opf-pptx
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf-editor
          ref: ${{ steps.refs.outputs.opf_editor }}
          path: opf-editor
          fetch-depth: 0
          persist-credentials: false
      # RR-15 (#24): the variable-font metric gate reads only the hashed Source Serif 4 fixtures and the retained
      # 356-row native evidence from the archived renderer checkpoint named in #24. Nothing is built from it.
      - name: Check out archived #24 fixtures and evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 343fb84223f4383ffe546157c6989ccc505c0acb
          path: archive
          persist-credentials: false
          sparse-checkout: |
            test/fixtures/font-formats/source-serif
            docs/evidence/rejected-truetype-rounding-20260915
          sparse-checkout-cone-mode: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: opf-render/package-lock.json
      - name: Install locked coordinated dependencies
        shell: bash
        working-directory: .
        run: |
          pnpm --dir opf install --frozen-lockfile
          for repo in opf-render opf-pptx opf-editor; do
            npm ci --prefix "$repo"
          done
      - name: Gate the published-dependency check (RR-55 opf.requiresUnreleasedCore)
        id: published-core
        run: node scripts/published-core-gate.mjs
      - name: Verify renderer with published core
        if: steps.published-core.outputs.skip != 'true'
        run: npm run test:packed
      - name: Build and link coordinated sources
        working-directory: opf
        run: |
          pnpm build
          node scripts/link-ecosystem.mjs --packages-only
      - name: Font policy snapshot matches the pinned core table
        run: node scripts/update-font-policy.mjs --check ../opf/spec/reference/font-policy.json
      - run: npm audit
      - run: npm run typecheck
      - run: npm run validate
      - run: npm run test:font-preparation
      - run: npm run test:font-variants
      - run: npm test
      - run: npm run test:code
      - name: Verify Playwright image version
        run: node -e "if (require('playwright/package.json').version !== '1.63.0') throw new Error('Update the pinned Playwright image with the test package.');"
      # RR-47: the browser commands are test/browser-suites.json; a quarantined test is deferred to the non-blocking step below.
      # RR-28: <opf-deck> and the slideshow player (test:player-browser) run in the pinned browser, offline (axe-core, speaker view, BroadcastChannel sync).
      - name: Browser suites
        run: node scripts/quarantine.mjs run-suite browser
      # Variable-font native advance gate (#24, RR-15): 0.15 px by owner decision 2026-10-01, this check only.
      - run: npm run test:variable-font-gate
      - name: Font and script browser suites
        run: node scripts/quarantine.mjs run-suite browser-fonts
      - name: Rich text browser suites
        run: node scripts/quarantine.mjs run-suite rich
      - name: Install and exercise coordinated candidate tarballs
        working-directory: opf
        run: |
          pnpm pack:ecosystem
          pnpm test:packed-ecosystem
          pnpm test:packed-browser
          node scripts/test-installed-code-guards.mjs
          node scripts/test-plain-whitespace-workflow.mjs artifacts/plain-whitespace-workflow installed
          node scripts/test-readability-browser.mjs artifacts/readability-browser installed
          node scripts/test-timeline-workflow.mjs artifacts/timeline-workflow installed
          node scripts/test-furniture-workflow.mjs artifacts/furniture-workflow installed
          node ../opf-editor/test/json-editor-browser.mjs artifacts/editor/json-editor-installed.json artifacts/npm/consumer
          node scripts/test-timeline-acceptance.mjs artifacts/timeline-acceptance.json
      - run: npm pack --dry-run
      # RR-47: tests listed in test/quarantine.json run here, after every gate, and are reported without failing the job.
      - name: Quarantined tests (non-blocking)
        if: always()
        continue-on-error: true
        run: node scripts/quarantine.mjs run-deferred
      - name: Preserve candidate and raster evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-opf-render-${{ runner.os }}-node24
          path: |
            opf/artifacts/editor/*report.json
            opf/artifacts/editor/json-editor-installed.json
            opf/artifacts/editor/*failure.png
            opf/artifacts/editor/*installed-code*.json
            opf-render/artifacts/golden/**
            opf-render/artifacts/quarantine/**
            opf-render/artifacts/jpeg/browser/report.json
            opf-render/artifacts/quote-footer/browser/report.json
            opf-render/artifacts/font-preparation*.json
            opf-render/artifacts/font-variants*.json
            opf-render/artifacts/variable-font-gate/**
            opf-render/artifacts/script-fonts-browser.json
            opf-render/artifacts/script-corpora-browser.json
            opf-render/artifacts/script-corpora-slides-browser.json
            opf-render/artifacts/script-fonts-auto/**
            opf/artifacts/plain-whitespace-workflow/**
            opf/artifacts/readability-browser/**
            opf/artifacts/timeline-workflow/**
            opf/artifacts/furniture-workflow/**
            opf/artifacts/timeline-acceptance.json
            opf-render/artifacts/plain-whitespace-browser/**
            opf-render/artifacts/rich-flow-browser/**
            opf-render/artifacts/rich-spacing-browser/**
          retention-days: 7
          if-no-files-found: ignore

  # RR-20: engines.node is the open-ended ">=22", so the range is tested: the package job above stays on Node 24 (the
  # development and evidence runtime) and this job repeats install, the published-dependency check, typecheck and the
  # unit suite on the oldest supported major and the current release. Browser, golden and native gates stay on Node 24.
  node-range:
    name: Node ${{ matrix.node }} (engines range)
    # Not on a plain pull request (see the header); an unrelated label starts nothing.
    if: ${{ github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'full-ci') && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')) }}
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 26]
    defaults:
      run:
        working-directory: opf-render
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          path: opf-render
      - name: Resolve the coordinated commits from core's ecosystem.lock.json
        id: refs
        uses: OpenPresentation/opf/.github/actions/ecosystem-refs@main
        with:
          consumer: opf-render
          export-golden: 'true'
          # Keep equal to the package job's golden-override (scripts/ecosystem-pins.mjs reads the first one).
          golden-override: ''
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf
          ref: ${{ steps.refs.outputs.opf }}
          path: opf
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf-pptx
          ref: ${{ steps.refs.outputs.opf_pptx }}
          path: opf-pptx
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf-editor
          ref: ${{ steps.refs.outputs.opf_editor }}
          path: opf-editor
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: opf-render/package-lock.json
      - name: Install locked coordinated dependencies
        shell: bash
        working-directory: .
        run: |
          node -e "console.log('Node', process.version)"
          pnpm --dir opf install --frozen-lockfile
          for repo in opf-render opf-pptx opf-editor; do
            npm ci --prefix "$repo"
          done
      - name: Gate the published-dependency check (RR-55 opf.requiresUnreleasedCore)
        id: published-core
        run: node scripts/published-core-gate.mjs
      - name: Verify renderer with published dependencies
        if: steps.published-core.outputs.skip != 'true'
        run: npm run test:packed
      - name: Build and link coordinated sources
        working-directory: opf
        run: |
          pnpm build
          node scripts/link-ecosystem.mjs --packages-only
      - run: npm run typecheck
      - run: npm test
