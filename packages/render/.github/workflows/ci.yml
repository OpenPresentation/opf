name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    timeout-minutes: 35
    defaults:
      run:
        working-directory: opf-render
    env:
      OPF_GOLDEN_BASELINE: ${{ github.workspace }}/opf-render/test/golden/opf-examples-png.cover-centering.sha256.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          path: opf-render
      # FF-19 uses core resolveScriptFonts (FF-18) and paragraphDirection (#134); sibling pins
      # match core main's ecosystem-ci. Verify the released graph before using source links.
      # FF-29 pins merged core (opf#132) that adds composed item.alignment.
      # FF-31 pins merged core (opf#133): src/font-policy.js snapshots its spec/reference/font-policy.json.
      # FF-31 Gelasio metric tier pins merged core opf#163 (Georgia disabledFeatures). opf-pptx and opf-editor move to the coordinated heads core main pins (ecosystem-ci), which pass core#155 and its packed quote test.
      # FF-31 (Intos) pins core PR opf#166 (core main plus the Intos policy, skills, docs and build scripts); repin to its merge commit once merged (never leave it on an unmerged head).
      # Cover centering pins merged core opf#169 (ce3c779): 103 golden slides move, selected through OPF_GOLDEN_BASELINE.
      # Release 0.11.7 pins core main b8db055 (the coordinated release plan and FF-58 closure plus the 0.11.7 lazy font count, opf#216); the opf-pptx and opf-editor pins are unchanged.
      # Release 0.11.6 pins core main b266190 (0.11.3 plus the 0.11.6 lazy font count, opf#211), the opf-pptx 0.11.4 release commit c08105f and opf-editor main 8bf5ba0 (both pass with the 100-layout catalog).
      # Release 0.11.8 pins core core main 3ae62f9 (records the 0.11.8 lazy font count, opf#219), opf-pptx main b5ed201 and opf-editor main 159c08b.
      # FF-43 pins core PR opf#178 (font policy measured values for the vendored Source Sans 3 rows, the measurement tools and the tracker); merged as 72d337bf5778cc7d9048d236debc10ba0d37fb4c.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf
          ref: 3ae62f9a01102fd43a9fc301ef59fdbb1cd998c6
          path: opf
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf-pptx
          ref: b5ed201ad2ab821162b0684ff5dbcb769d2b2a64
          path: opf-pptx
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf-editor
          ref: 159c08b3e45d6d0cb9bd7d2938618e1bc3550baa
          path: opf-editor
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: opf-render/package-lock.json
      - name: Install locked coordinated dependencies
        shell: bash
        working-directory: .
        run: |
          pnpm --dir opf install --frozen-lockfile
          for repo in opf-render opf-pptx opf-editor; do
            npm ci --prefix "$repo"
          done
      - name: Verify renderer with published core
        run: npm run test:packed
      - name: Build and link coordinated sources
        working-directory: opf
        run: |
          pnpm build
          node scripts/link-ecosystem.mjs --packages-only
      - name: Font policy snapshot matches the pinned core table
        run: node scripts/update-font-policy.mjs --check ../opf/spec/reference/font-policy.json
      - run: npm audit
      - run: npm run typecheck
      - run: npm run validate
      - run: npm run test:font-preparation
      - run: npm run test:font-variants
      - run: npm test
      - run: npm run test:code
      - name: Verify Playwright image version
        run: node -e "if (require('playwright/package.json').version !== '1.63.0') throw new Error('Update the pinned Playwright image with the test package.');"
      - run: npm run test:browser
      - run: npm run test:code-browser
      - run: npm run test:font-preparation-browser
      - run: npm run test:font-variants-browser
      - run: npm run test:aptos-preview-browser
      - run: npm run test:lazy-fonts-browser
      - run: npm run test:extra-lazy-fonts-browser
      - run: npm run test:lazy-face-fallback-browser
      - run: npm run test:script-fonts-browser
      - run: npm run test:script-fonts-auto-browser
      - run: npm run test:plain-whitespace-browser
      - id: rich-flow
        run: npm run test:rich-flow-browser
      - if: ${{ success() || steps.rich-flow.conclusion == 'failure' }}
        run: npm run test:rich-spacing-browser
      - name: Install and exercise coordinated candidate tarballs
        working-directory: opf
        run: |
          pnpm pack:ecosystem
          pnpm test:packed-ecosystem
          pnpm test:packed-browser
          node scripts/test-installed-code-guards.mjs
          node scripts/test-plain-whitespace-workflow.mjs artifacts/plain-whitespace-workflow installed
          node scripts/test-readability-browser.mjs artifacts/readability-browser installed
          node scripts/test-timeline-workflow.mjs artifacts/timeline-workflow installed
          node scripts/test-furniture-workflow.mjs artifacts/furniture-workflow installed
          node ../opf-editor/test/json-editor-browser.mjs artifacts/editor/json-editor-installed.json artifacts/npm/consumer
          node scripts/test-timeline-acceptance.mjs artifacts/timeline-acceptance.json
      - run: npm pack --dry-run
      - name: Preserve candidate and raster evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-opf-render-${{ runner.os }}-node24
          path: |
            opf/artifacts/editor/*report.json
            opf/artifacts/editor/json-editor-installed.json
            opf/artifacts/editor/*failure.png
            opf/artifacts/editor/*installed-code*.json
            opf-render/artifacts/golden/**
            opf-render/artifacts/jpeg/browser/report.json
            opf-render/artifacts/quote-footer/browser/report.json
            opf-render/artifacts/font-preparation*.json
            opf-render/artifacts/font-variants*.json
            opf-render/artifacts/script-fonts-browser.json
            opf-render/artifacts/script-fonts-auto/**
            opf/artifacts/plain-whitespace-workflow/**
            opf/artifacts/readability-browser/**
            opf/artifacts/timeline-workflow/**
            opf/artifacts/furniture-workflow/**
            opf/artifacts/timeline-acceptance.json
            opf-render/artifacts/plain-whitespace-browser/**
            opf-render/artifacts/rich-flow-browser/**
            opf-render/artifacts/rich-spacing-browser/**
          retention-days: 7
          if-no-files-found: ignore
