name: Publish @openpresentation/opf-pptx
on:
  push:
    tags: ["opf-pptx-v*", "@openpresentation/opf-pptx@v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  npm:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@11.16.0
      - run: npm ci
      - run: npm audit
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          case "${GITHUB_REF_NAME}" in
            "opf-pptx-v${VERSION}"|"@openpresentation/opf-pptx@v${VERSION}") ;;
            *) echo "Release tag does not match package version ${VERSION}."; exit 1 ;;
          esac
      - run: npm run typecheck
      - run: npm run validate
      - run: npm test
      - run: npm run test:packed
      - name: Verify Playwright image version
        run: node -e "if (require('playwright/package.json').version !== '1.63.0') throw new Error('Update the pinned Playwright image with the test package.');"
      - run: npm run test:browser
      - run: npm pack --dry-run
      - run: npm publish --access public --provenance
