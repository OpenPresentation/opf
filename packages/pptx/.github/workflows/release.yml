name: Publish @openpresentation/opf-pptx
on:
  push:
    tags: ["opf-pptx-v*", "@openpresentation/opf-pptx@v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  npm:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Trust the checked-out workspace for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify merged release source
        run: node scripts/publish-source.mjs --manifest package.json --tag-prefix opf-pptx-v --tag-prefix @openpresentation/opf-pptx@v
      # RR-100: the tagged commit's own CI is the evidence (scripts/ci-evidence.mjs, scripts/ci-evidence.json): the push-to-main run of
      # ci.yml on exactly this commit must have succeeded, with its package job(s) and the Node 22 and Node 26 engines-range legs.
      # Nothing is re-tested below; the steps that remain verify the artifact itself. Fails closed: a missing, running or failed
      # run means no publish.
      - name: Verify the CI evidence of this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-evidence.mjs --sha "$(git rev-parse HEAD)"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@11.16.0
      - run: npm ci
      - run: npm audit
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          case "${GITHUB_REF_NAME}" in
            "opf-pptx-v${VERSION}"|"@openpresentation/opf-pptx@v${VERSION}") ;;
            *) echo "Release tag does not match package version ${VERSION}."; exit 1 ;;
          esac
      # RR-100: typecheck, validate, the tests and the browser suites ran in CI on this exact commit; the steps below verify the artifact.
      - name: Refuse a declared unreleased core (RR-55)
        run: node scripts/published-core-gate.mjs --forbid
      - run: npm run test:packed
      - run: npm pack --dry-run
      - run: npm publish --access public --provenance

  # RR-20: every npm publish creates its GitHub Release (from 0.18 on), notes taken from the version's CHANGELOG.md section.
  # Separate job: only it holds contents: write; the publish job keeps id-token: write for provenance and contents: read.
  release:
    name: Create GitHub Release
    needs: npm
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="$(echo "${GITHUB_REF_NAME}" | sed -E 's/^(opf-pptx-v|@openpresentation\/opf-pptx@v)//')"
          NOTES_FILE="$(mktemp)"

          # The section under "## VERSION" or "## VERSION (date)", without its blank edges.
          awk -v ver="## ${VERSION}" '
            $0 == ver || index($0, ver " ") == 1 { found = 1; next }
            /^## / { if (found) exit }
            found { lines[++n] = $0 }
            END {
              s = 1; while (s <= n && lines[s] ~ /^[[:space:]]*$/) s++
              e = n; while (e >= s && lines[e] ~ /^[[:space:]]*$/) e--
              for (i = s; i <= e; i++) print lines[i]
            }
          ' CHANGELOG.md > "${NOTES_FILE}"

          if [ ! -s "${NOTES_FILE}" ]; then
            echo "CHANGELOG.md has no '## ${VERSION}' section (or it is empty); add it before publishing." >&2
            exit 1
          fi

          echo "NOTES_FILE=${NOTES_FILE}" >> "${GITHUB_ENV}"
          echo "RELEASE_VERSION=${VERSION}" >> "${GITHUB_ENV}"
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --json tagName >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; preserving its notes."
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "@openpresentation/opf-pptx ${RELEASE_VERSION}" \
              --notes-file "${NOTES_FILE}" \
              --verify-tag \
              --latest
          fi
