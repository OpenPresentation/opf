name: CI
on:
  pull_request:
  # RR-48: ready for the merge queue (a no-op until the owner enables it, opf#297). A queue run has no
  # pull_request payload, so the concurrency group falls back to its own gh-readonly-queue ref, and a
  # queue run is never cancelled by a newer push.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}
jobs:
  package:
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.os == 'ubuntu-latest' && 'mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27' || '' }}
    timeout-minutes: 35
    defaults:
      run:
        working-directory: opf-pptx
        # PowerShell reports only the final native command's exit code in a
        # multiline step. Bash's Actions wrapper stops on the first failure.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          path: opf-pptx
      # RR-47: an expired or malformed test/quarantine.json entry fails CI. See test/QUARANTINE.md.
      - name: Check the test quarantine
        run: node --test scripts/quarantine.test.mjs scripts/browser-suites.test.mjs && node scripts/quarantine.mjs check
      # RR-46: a reminder, never a failure: src/ changed without a changelog fragment (changes/README.md).
      - name: Changelog fragment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: node scripts/changelog-fragments.mjs warn-missing --base origin/${{ github.base_ref }}
      # RR-50: no hand pins. The commits of the other OpenPresentation repositories (and OPF_GOLDEN_BASELINE, exported to
      # the later steps) come from core's ecosystem.lock.json, written by the roller. A `Depends-On:` trailer in the pull
      # request body tests an unmerged pull request of another repository instead (core docs/ecosystem-development.md).
      - name: Resolve the coordinated commits from core's ecosystem.lock.json
        id: refs
        uses: OpenPresentation/opf/.github/actions/ecosystem-refs@main
        with:
          consumer: opf-pptx
          export-golden: 'true'
      # Verify registry dependencies before linking the pinned source graph.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf
          ref: ${{ steps.refs.outputs.opf }}
          path: opf
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf-render
          ref: ${{ steps.refs.outputs.opf_render }}
          path: opf-render
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf-editor
          ref: ${{ steps.refs.outputs.opf_editor }}
          path: opf-editor
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: opf-pptx/package-lock.json
      - name: Install locked coordinated dependencies
        shell: bash
        working-directory: .
        run: |
          pnpm --dir opf install --frozen-lockfile
          for repo in opf-render opf-pptx opf-editor; do
            npm ci --prefix "$repo"
          done
      - name: Verify PPTX with published dependencies
        run: npm run test:packed
      - name: Build and link coordinated sources
        working-directory: opf
        run: |
          pnpm build
          node scripts/link-ecosystem.mjs --packages-only
      - run: npm audit
      - run: npm run typecheck
      - run: npm run test:native-picture-edit-controls
      - run: npm run test:native-font-embed-controls
      - run: npm run test:native-mixed-edit-controls
      - run: npm run test:native-font-inventory-controls
      - name: Verify bounded native harness without Office
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & "$env:WINDIR/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -File test/native-process-check.ps1 -OutputDirectory artifacts/native-picture-harness/worker
          if ($LASTEXITCODE -ne 0) { throw 'Native process controls failed' }
          & "$env:WINDIR/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -File test/native-picture-harness-check.ps1 -ReportPath artifacts/native-picture-harness/check.json
          if ($LASTEXITCODE -ne 0) { throw 'Native picture harness controls failed' }
          & "$env:WINDIR/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -File test/native-picture-edit-harness-check.ps1 -ReportPath artifacts/native-picture-harness/edit-check.json
          if ($LASTEXITCODE -ne 0) { throw 'Native picture edit harness controls failed' }
          & "$env:WINDIR/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -File test/native-furniture-harness-check.ps1 -ReportPath artifacts/native-picture-harness/furniture-check.json
          if ($LASTEXITCODE -ne 0) { throw 'Native furniture harness controls failed' }
          & "$env:WINDIR/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -File test/native-tab-control-v2.ps1 -PureRegression
          if ($LASTEXITCODE -ne 0) { throw 'Native tab metrics regression failed' }
          & "$env:WINDIR/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -File test/native-font-edit.ps1 -PureRegression
          if ($LASTEXITCODE -ne 0) { throw 'Native font edit controls failed' }
          & "$env:WINDIR/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -File test/native-font-embed.ps1 -PureRegression
          if ($LASTEXITCODE -ne 0) { throw 'Native font embed controls failed' }
          & "$env:WINDIR/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -File test/native-mixed-edit.ps1 -PureRegression
          if ($LASTEXITCODE -ne 0) { throw 'Native mixed-size edit controls failed' }
          & "$env:WINDIR/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -File test/native-font-inventory.ps1 -PureRegression
          if ($LASTEXITCODE -ne 0) { throw 'Native font inventory controls failed' }
      - run: npm run validate
      - run: npm test
      # A design-fields export still imports with the released importer without losing provenance (needs the registry).
      - run: npm run test:published-import
      - run: npm run test:font-variants
      - run: npm run test:code
      - name: Verify Playwright image version
        run: node -e "if (require('playwright/package.json').version !== '1.63.0') throw new Error('Update the pinned Playwright image with the test package.');"
      - if: runner.os == 'Windows'
        run: npx playwright install chromium
      # RR-47: test/browser-suites.json (the commands of npm run test:browser); a quarantined test is deferred to the non-blocking step below.
      - name: Browser suite
        run: node scripts/quarantine.mjs run-suite browser
      - name: Install and exercise coordinated candidate tarballs
        working-directory: opf
        run: |
          # Git-for-Windows GNU tar (first on PATH under bash) reads C:... as host:path; use Windows bsdtar.
          if [ "$RUNNER_OS" = Windows ]; then export PATH="/c/Windows/System32:$PATH"; fi
          pnpm pack:ecosystem
          pnpm test:packed-ecosystem
          pnpm test:packed-browser
          node scripts/test-plain-whitespace-workflow.mjs artifacts/plain-whitespace-workflow installed
          node scripts/test-readability-browser.mjs artifacts/readability-browser installed
          node scripts/test-timeline-workflow.mjs artifacts/timeline-workflow installed
          node scripts/test-furniture-workflow.mjs artifacts/furniture-workflow installed
          node ../opf-editor/test/json-editor-browser.mjs artifacts/editor/json-editor-installed.json artifacts/npm/consumer
          node scripts/test-timeline-acceptance.mjs artifacts/timeline-acceptance.json
          node scripts/test-installed-code-guards.mjs
      - run: npm pack --dry-run
      # RR-47: tests listed in test/quarantine.json run here, after every gate, and are reported without failing the job.
      - name: Quarantined tests (non-blocking)
        if: always()
        continue-on-error: true
        run: node scripts/quarantine.mjs run-deferred
      - name: Preserve candidate and raster evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-opf-pptx-${{ runner.os }}-node24
          path: |
            opf-pptx/artifacts/quarantine/**
            opf/artifacts/plain-whitespace-workflow/**
            opf/artifacts/readability-browser/**
            opf/artifacts/timeline-workflow/**
            opf/artifacts/furniture-workflow/**
            opf/artifacts/timeline-acceptance.json
            opf/artifacts/editor/*report.json
            opf/artifacts/editor/json-editor-installed.json
            opf/artifacts/editor/*failure.png
            opf/artifacts/editor/*installed-code*.json
            opf-render/artifacts/golden/**
            opf-pptx/artifacts/packed-consumer-node24.json
            opf-pptx/artifacts/zip-date/**
            opf-pptx/artifacts/native-text-whitespace/**
            opf-pptx/artifacts/native-underline/**
            opf-pptx/artifacts/native-body-rich-text/**
            opf-pptx/artifacts/native-picture-harness/**
          retention-days: 7
          if-no-files-found: ignore
