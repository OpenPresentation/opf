<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPF deck</title>
<style>/*OPF_CSS*/</style>
</head>
<body>
<div id="opf-deck" data-view="preview">
  <header class="deck-bar">
    <div id="deck-title" class="deck-title"></div>
    <div id="deck-history" class="deck-history"></div>
    <div class="deck-tabs" role="tablist" aria-label="View">
      <button type="button" role="tab" id="tab-preview" aria-controls="deck-panes" aria-selected="true">Preview</button>
      <button type="button" role="tab" id="tab-source" aria-controls="deck-panes" aria-selected="false" tabindex="-1">Source</button>
      <button type="button" role="tab" id="tab-both" aria-controls="deck-panes" aria-selected="false" tabindex="-1">Both</button>
    </div>
    <div id="deck-review-pill" class="deck-item"></div>
    <div id="deck-design" class="deck-item"></div>
    <button type="button" id="deck-find-open" class="deck-button deck-icon" aria-label="Find and replace" title="Find and replace · Ctrl/Cmd F"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <span class="deck-spacer"></span>
    <button type="button" id="deck-expand" class="deck-button deck-icon" aria-label="Full screen" title="Full screen" hidden><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
    <button type="button" id="deck-send" class="deck-button deck-primary" hidden disabled>Send to Claude</button>
  </header>
  <div id="deck-root" class="deck-root">
    <div id="deck-find" class="deck-find"></div>
    <div id="deck-panes" class="deck-panes" role="tabpanel">
      <section id="deck-source" class="deck-source" aria-label="Deck source"></section>
      <section class="deck-stage-col" aria-label="Slides">
        <div id="deck-stage" class="deck-stage"><div id="deck-canvas" class="deck-canvas"></div></div>
        <div class="deck-row"><div id="deck-nav" class="deck-nav"></div><div id="deck-thumbs" class="deck-thumbs"></div></div>
      </section>
    </div>
    <aside id="deck-review" class="deck-review" aria-label="Review" hidden>
      <div class="deck-review-head"><span class="deck-review-title">Review</span><button type="button" id="deck-review-close" class="deck-button" aria-label="Close the review">Close</button></div>
      <div id="deck-review-panel" class="deck-review-panel"></div>
    </aside>
  </div>
  <footer class="deck-foot"><span id="deck-notice" class="deck-notice" role="status"></span><span id="deck-status" class="deck-status"></span></footer>
</div>
<script type="module">/*OPF_JS*/</script>
</body>
</html>
