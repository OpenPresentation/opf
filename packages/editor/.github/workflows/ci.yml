name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    timeout-minutes: 35
    defaults:
      run:
        working-directory: opf-editor
    env:
      OPF_GOLDEN_BASELINE: ${{ github.workspace }}/opf-render/test/golden/opf-examples-png.furniture.sha256.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          path: opf-editor
      # The ecosystem is pinned to the versions this package depends on: opf main after #219 (the packed-ecosystem check there knows renderer 0.11.8), opf-render 0.11.8 (tag colour; extra lazy fonts, face-level lazy fonts and host render options; lazy script and preview faces, incl. Barlow, which test:playground exercises; chart label rotation) and opf-pptx 0.11.5.
      # Release 0.10.6 pins the 0.11.4 train sources: opf#234 (design fields, picture bullets, 0.11.9 lazy face count), opf-render main fa1949a and opf-pptx main 9b9b0e4; repin each to its merge commit (opf-pptx to the merge of #124). The registry dependencies resolve once core 0.11.4, renderer 0.11.9 and PPTX 0.11.7 are published (npm ci and test:packed).
      # Verify registry dependencies before linking the pinned source graph.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf
          ref: d3823512500d199eb45340bbc450eda6ac028750 # core main (RR-16, RR-17, RR-26 convert, RR-29 audit, RR-31 patch, RR-32 template variables)
          path: opf
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf-render
          ref: 34cdfee7aa9e772998abb6aaf181b497fc606aa3 # opf-render main (RR-17 #92, RR-23 export-browser, RR-32 variables option)
          path: opf-render
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenPresentation/opf-pptx
          ref: 405259cfa2e6c198ba7256f03d3d235c0358df60 # opf-pptx main (RR-33, RR-34, RR-35, RR-36)
          path: opf-pptx
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: opf-editor/package-lock.json
      - name: Install locked coordinated dependencies
        shell: bash
        working-directory: .
        run: |
          pnpm --dir opf install --frozen-lockfile
          for repo in opf-render opf-pptx opf-editor; do
            npm ci --prefix "$repo"
          done
      # RR-26 and RR-31: the editor imports @openpresentation/opf/convert and /patch, which published core 0.11.4 does not export. The packed check against registry dependencies therefore waits for the core release that lists them (the release-prep PR raises the core floor and removes this condition); every other gate below runs against the pinned source graph.
      - name: Verify editor with published dependencies
        run: |
          if node -e "process.exit(require('@openpresentation/opf/package.json').exports['./patch'] && require('@openpresentation/opf/package.json').exports['./convert'] ? 0 : 1)"; then
            npm run test:packed
          else
            echo "::notice::RR-26/RR-31: the published @openpresentation/opf has no ./convert or ./patch export yet, so test:packed is skipped until the core release."
          fi
      - name: Build and link coordinated sources
        working-directory: opf
        run: |
          pnpm build
          node scripts/link-ecosystem.mjs --packages-only
      - run: npm audit
      - run: npm run typecheck
      - run: npm run validate
      # FF-16: the linked opf-pptx has checkPptxTypefaces (FF-08), so the exports-after-switch
      # test must run the check rather than skip it.
      - run: npm test
        env:
          OPF_REQUIRE_FF08: "1"
      - name: Verify Playwright image version
        run: node -e "if (require('playwright/package.json').version !== '1.63.0') throw new Error('Update the pinned Playwright image with the test package.');"
      - run: npm run test:playground
      - run: npm run test:data-grid-browser
      - run: npm run test:code-browser
      - run: npm run test:selection-browser
      - run: npm run test:click-entry-browser
      - run: npm run test:json-browser -- artifacts/json-editor-browser.json
      - run: npm run test:rich-input-browser -- artifacts/rich-input-browser.json measured
      - run: npm run test:rich-input-browser -- artifacts/rich-input-browser-estimated.json estimated
      - name: Install and exercise coordinated candidate tarballs
        working-directory: opf
        run: |
          pnpm pack:ecosystem
          pnpm test:packed-ecosystem
          pnpm test:packed-browser
          node scripts/test-plain-whitespace-workflow.mjs artifacts/plain-whitespace-workflow installed
          node scripts/test-readability-browser.mjs artifacts/readability-browser installed
          node scripts/test-timeline-workflow.mjs artifacts/timeline-workflow installed
          node scripts/test-furniture-workflow.mjs artifacts/furniture-workflow installed
          node scripts/test-timeline-acceptance.mjs artifacts/timeline-acceptance.json
          node scripts/test-installed-code-guards.mjs
          node ../opf-editor/test/rich-input-browser.mjs artifacts/editor/rich-input-installed.json measured artifacts/npm/consumer
          node ../opf-editor/test/json-editor-browser.mjs artifacts/editor/json-editor-installed.json artifacts/npm/consumer
      - run: npm pack --dry-run
      - name: Preserve candidate and raster evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-opf-editor-${{ runner.os }}-node24
          path: |
            opf-editor/artifacts/rich-input-browser*.json
            opf-editor/artifacts/json-editor-browser.json
            opf-editor/artifacts/packed-consumer-node24.json
            opf-editor/artifacts/packed-json*-node24.json
            opf/artifacts/editor/json-editor-installed.json
            opf-editor/artifacts/rich-input-browser*.png
            opf/artifacts/editor/rich-input-installed*.json
            opf/artifacts/editor/rich-input-installed*.png
            opf/artifacts/plain-whitespace-workflow/**
            opf/artifacts/readability-browser/**
            opf/artifacts/timeline-workflow/**
            opf/artifacts/furniture-workflow/**
            opf/artifacts/timeline-acceptance.json
            opf/artifacts/editor/*report.json
            opf/artifacts/editor/*failure.png
            opf/artifacts/editor/*installed-code*.json
            opf-render/artifacts/golden/**
          retention-days: 7
          if-no-files-found: ignore
